const LAB_SRC = "\"\"\"Session 3 (2026, semester 2): linear ODE systems, the matrix exponential, and transfer functions.\n\nCourse notation: dx/dt = K x, x(0) = x0; K = V Lambda V^-1 with eigenvalues lambda_i (Session 2);\nx(t) = expm(K t) x0 = sum_i c_i exp(lambda_i t) v_i with c = V^-1 x0. Time constants tau_i = -1/Re(lambda_i).\n\nRun `python linode_lab.py` for a printed summary, or `python linode_lab.py --json`\nto write linode-results.json, which the slides and the lab page read.\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy.integrate import solve_ivp\nfrom scipy.linalg import eig, expm, null_space\n\n\ndef r6(v):\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\ndef sig(v, n=4):\n    return f\"{float(v):.{n}g}\"\n\n\ndef eig_sorted(K):\n    \"\"\"Eigenvalues sorted by real part, descending (0 first for a closed network), real when the imaginary part is negligible.\"\"\"\n    w, V = eig(K)\n    order = np.argsort(-w.real); w, V = w[order], V[:, order]\n    if np.all(np.abs(w.imag) < 1e-12):\n        w, V = w.real, V.real\n    return w, V\n\n\n# ---------------------------------------------------------------------------\n# Part 1. Consecutive reactions A -> B -> C\n# ---------------------------------------------------------------------------\nCONSEC = {\"k1\": 1.0, \"k2\": 0.5}          # 1/min\n\n\ndef consecutive():\n    k1, k2 = CONSEC[\"k1\"], CONSEC[\"k2\"]\n    K = np.array([[-k1, 0, 0], [k1, -k2, 0], [0, k2, 0]])\n    w, V = eig_sorted(K)\n    x0 = np.array([1.0, 0, 0])\n    t = np.linspace(0, 10, 101)\n    X = np.array([expm(K * s) @ x0 for s in t])\n    sol = solve_ivp(lambda s, x: K @ x, (0, 10), x0, t_eval=t, rtol=1e-10, atol=1e-12)\n    tmax = np.log(k1 / k2) / (k1 - k2)\n    left = null_space(K.T).ravel(); left = left / left[0]\n    return {\"K\": K.tolist(), \"lam\": w.tolist(), \"V\": V.T.tolist(), \"t\": t.tolist(), \"X\": X.tolist(),\n            \"max_diff_ivp\": float(np.abs(sol.y.T - X).max()), \"tmaxB\": float(tmax), \"Bmax\": float(expm(K * tmax)[1, 0]),\n            \"left_null\": left.tolist()}\n\n\n# ---------------------------------------------------------------------------\n# Part 2. Complex eigenvalues: an underdamped second-order process\n# ---------------------------------------------------------------------------\ndef oscillator(zeta=0.2, wn=1.0):\n    K = np.array([[0, 1], [-wn ** 2, -2 * zeta * wn]])\n    w, _ = eig(K)\n    t = np.linspace(0, 20, 201)\n    X = np.array([expm(K * s) @ np.array([1.0, 0.0]) for s in t])\n    return {\"zeta\": zeta, \"lam_re\": float(w[0].real), \"lam_im\": float(abs(w[0].imag)), \"t\": t.tolist(), \"y\": X[:, 0].tolist(),\n            \"period\": float(2 * np.pi / abs(w[0].imag)), \"decay\": float(np.exp(2 * np.pi * w[0].real / abs(w[0].imag)))}\n\n\n# ---------------------------------------------------------------------------\n# Part 3. Two CSTRs in series: transfer function, poles, step response\n# ---------------------------------------------------------------------------\nTANKS = {\"tau1\": 2.0, \"tau2\": 1.0}       # min\n\n\ndef tanks():\n    t1, t2 = TANKS[\"tau1\"], TANKS[\"tau2\"]\n    K = np.array([[-1 / t1, 0], [1 / t2, -1 / t2]])\n    b = np.array([1 / t1, 0])\n    w, _ = eig_sorted(K)\n    t = np.linspace(0, 12, 121)\n    # step response y(t) = c2(t) for a unit step in the feed: x(t) = K^-1 (expm(Kt) - I) b\n    y = [float((np.linalg.solve(K, (expm(K * s) - np.eye(2)) @ b))[1]) for s in t]\n    exact = [1 - (t1 * np.exp(-s / t1) - t2 * np.exp(-s / t2)) / (t1 - t2) for s in t]\n    return {\"poles\": w.tolist(), \"t\": t.tolist(), \"y\": y, \"max_diff\": float(np.max(np.abs(np.array(y) - exact))),\n            \"t63\": float(t[np.argmax(np.array(y) >= 1 - np.exp(-1))])}\n\n\n# ---------------------------------------------------------------------------\n# Part 4. Stiffness: explicit Euler on eigenvalues -1 and -1000\n# ---------------------------------------------------------------------------\ndef stiffness():\n    K = np.array([[-1.0, 0.0], [999.0, -1000.0]])\n    w, _ = eig_sorted(K)\n    x0 = np.array([1.0, 0.0])\n    out = []\n    for h in (0.0005, 0.0019, 0.0021, 0.01):\n        x = x0.copy(); n = int(round(0.1 / h))\n        for _ in range(n):\n            x = x + h * (K @ x)\n        xi = x0.copy()\n        Mi = np.linalg.inv(np.eye(2) - h * K)\n        for _ in range(n):\n            xi = Mi @ xi\n        ex = expm(K * n * h) @ x0\n        out.append({\"h\": h, \"t\": n * h, \"euler\": x.tolist(), \"implicit\": xi.tolist(), \"exact\": ex.tolist()})\n    return {\"lam\": w.tolist(), \"ratio\": float(w.min() / w.max()), \"hmax\": float(2 / abs(w.min())), \"runs\": out}\n\n\n# ---------------------------------------------------------------------------\n# Part 5. Lab: butene isomerization network (reversible triangle, detailed balance)\n# ---------------------------------------------------------------------------\n# Species 1-butene (1), cis-2-butene (2), trans-2-butene (3). Equilibrium mole fractions and the\n# symmetric \"conductances\" c_ij = k_ij x_i* = k_ji x_j* are SYNTHETIC values chosen to resemble the\n# network Wei and Prater (1962) analyzed; units of c: 1/h.\nBUT = {\"names\": [\"1-butene\", \"cis-2-butene\", \"trans-2-butene\"], \"xeq\": [0.15, 0.30, 0.55],\n       \"c\": {\"12\": 0.60, \"13\": 0.15, \"23\": 0.30}}\n\n\ndef rate_matrix(c13=None):\n    x = np.array(BUT[\"xeq\"]); c = dict(BUT[\"c\"])\n    if c13 is not None:\n        c[\"13\"] = c13\n    k = np.zeros((3, 3))                     # k[i, j]: rate constant of i -> j\n    for key, v in c.items():\n        i, j = int(key[0]) - 1, int(key[1]) - 1\n        k[i, j] = v / x[i]; k[j, i] = v / x[j]\n    K = k.T - np.diag(k.sum(axis=1))\n    return K, k\n\n\ndef butene(c13=None):\n    K, k = rate_matrix(c13)\n    w, V = eig_sorted(K)\n    xeq = np.array(BUT[\"xeq\"])\n    for i in range(3):\n        V[:, i] /= np.abs(V[:, i]).max() * np.sign(V[np.argmax(np.abs(V[:, i])), i])\n    taus = [float(-1 / w[i]) for i in (1, 2)]\n    runs = {}\n    t = np.linspace(0, 3, 151)\n    for s, x0 in ((\"pure1\", [1, 0, 0]), (\"pure2\", [0, 1, 0]), (\"pure3\", [0, 0, 1]),\n                  (\"slow\", (xeq + 0.12 * V[:, 1]).tolist()), (\"fast\", (xeq + 0.12 * V[:, 2]).tolist())):\n        X = np.array([expm(K * u) @ np.array(x0, float) for u in t])\n        runs[s] = {\"x0\": list(map(float, x0)), \"X\": X.tolist()}\n    sol = solve_ivp(lambda s, x: K @ x, (0, 0.25), [1, 0, 0], t_eval=[0.25], rtol=1e-11, atol=1e-13, method=\"Radau\")\n    x2 = expm(K * 0.25) @ np.array([1.0, 0, 0])\n    return {\"K\": K.tolist(), \"k\": k.tolist(), \"lam\": w.tolist(), \"V\": V.T.tolist(), \"taus\": taus, \"ratio\": float(w[2] / w[1]),\n            \"t\": t.tolist(), \"runs\": runs, \"x_at2\": x2.tolist(), \"ivp_at2\": sol.y[:, 0].tolist(),\n            \"colsum\": float(np.abs(K.sum(axis=0)).max())}\n\n\ndef butene_sweep():\n    out = []\n    for c13 in np.round(np.arange(0.0, 1.201, 0.05), 2):\n        K, _ = rate_matrix(float(c13)); w, _ = eig_sorted(K)\n        out.append({\"c13\": float(c13), \"lam\": w.tolist(), \"ratio\": float(w[2] / w[1])})\n    return out\n\n\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, (np.floating, float)):\n        v = float(o)\n        return 0.0 if abs(v) < 1e-14 else v\n    if isinstance(o, np.integer):\n        return int(o)\n    return o\n\n\ndef classroom_results():\n    R = {\"lecture\": {\"consec\": consecutive(), \"osc\": oscillator(), \"tanks\": tanks(), \"stiff\": stiffness()},\n         \"lab\": {\"but\": butene(), \"sweep\": butene_sweep(), \"names\": BUT[\"names\"], \"xeq\": BUT[\"xeq\"], \"c\": BUT[\"c\"]},\n         \"versions\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__}}\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"linode-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote linode-results.json\"); sys.exit()\n    C = R[\"lecture\"][\"consec\"]\n    print(\"1 consec lam\", r6(C[\"lam\"]), \"left null\", r6(C[\"left_null\"]), \"tmaxB\", r6(C[\"tmaxB\"]), \"Bmax\", r6(C[\"Bmax\"]), \"ivp diff\", sig(C[\"max_diff_ivp\"]))\n    O = R[\"lecture\"][\"osc\"]; print(\"2 osc lam\", r6(O[\"lam_re\"]), r6(O[\"lam_im\"]), \"period\", r6(O[\"period\"]), \"decay/cycle\", r6(O[\"decay\"]))\n    T = R[\"lecture\"][\"tanks\"]; print(\"3 tanks poles\", r6(T[\"poles\"]), \"t63\", r6(T[\"t63\"]), \"diff\", sig(T[\"max_diff\"]))\n    S = R[\"lecture\"][\"stiff\"]; print(\"4 stiff lam\", r6(S[\"lam\"]), \"hmax\", r6(S[\"hmax\"]))\n    for q in S[\"runs\"]:\n        print(\"  h\", q[\"h\"], \"euler\", [sig(v) for v in q[\"euler\"]], \"implicit\", [sig(v) for v in q[\"implicit\"]], \"exact\", [sig(v) for v in q[\"exact\"]])\n    B = R[\"lab\"][\"but\"]; print(\"5 butene lam\", r6(B[\"lam\"]), \"taus\", r6(B[\"taus\"]), \"ratio\", r6(B[\"ratio\"]), \"x(2)\", r6(B[\"x_at2\"]), \"ivp\", r6(B[\"ivp_at2\"]))\n    print(\"  V\", r6(B[\"V\"]))\n    print(\"  sweep\", [(q[\"c13\"], round(q[\"ratio\"], 3)) for q in R[\"lab\"][\"sweep\"]][::4])\n";   // embedded copy, so live Python also works when the file is opened locally

const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};
const fmt = (x,d=0)=>x==null?"–":Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}

S.push({kicker:"Part 1 · Complex eigenvalues", title:"A complex pair is a damped oscillation", html:()=>`<div class="body"><div class="col w55"><div class="panel grow"><div class="chart" id="ch-osc"></div></div>

S.push({kicker:"Part 2 · Computing e^(Kt)", title:"How to compute the matrix exponential, and how not to", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
With an input: dx/dt = Kx + bu(t)<br>
x(t) = e<sup>Kt</sup>x<sub>0</sub> + ∫<sub>0</sub><sup>t</sup> e<sup>K(t−s)</sup>b u(s) ds<br>
Constant u: x(t) = e<sup>Kt</sup>x<sub>0</sub> + K⁻¹(e<sup>Kt</sup> − I)b u<br>
Properties: e<sup>K(t+s)</sup> = e<sup>Kt</sup>e<sup>Ks</sup>; &nbsp;d/dt e<sup>Kt</sup> = Ke<sup>Kt</sup>; &nbsp;e<sup>A+B</sup> = e<sup>A</sup>e<sup>B</sup> only if AB = BA</div></div>
<p class="note">The integral is variation of constants, the vector form of the integrating factor. K⁻¹ needs K invertible (no zero eigenvalue).</p></div>
<div class="col"><table class="t" style="font-size:17px"><tr><th>Method</th><th>When</th></tr>
<tr><td>Ve<sup>Λt</sup>V⁻¹</td><td>Symmetric or well-conditioned V; gives insight</td></tr>
<tr><td>Scaling and squaring with a Padé approximant (<code>scipy.linalg.expm</code>)</td><td>The default for a dense matrix</td></tr>
<tr><td>An ODE solver (<code>solve_ivp</code>)</td><td>Large, sparse or nonlinear systems; inputs that vary in time</td></tr>
<tr><td>The Taylor series term by term</td><td>Never for ‖Kt‖ large: terms grow before they cancel, and rounding destroys the result</td></tr></table>
<p class="note">Moler and Van Loan reviewed nineteen ways to compute the matrix exponential; most are unreliable in some cases. Use the library and check against a solver.</p></div></div>`});

S.push({kicker:"Part 2 · Laplace and transfer functions", title:"Poles are the eigenvalues of K", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
ℒ: sX(s) − x<sub>0</sub> = KX(s) + bU(s)<br>
X(s) = (sI − K)⁻¹(x<sub>0</sub> + bU(s))<br>
Output y = cᵀx: &nbsp;G(s) = Y(s)/U(s) = cᵀ(sI − K)⁻¹b<br>
(sI − K)⁻¹ = adj(sI − K)/det(sI − K) ⇒ poles ⊆ {λ<sub>i</sub>}</div></div>
<p class="note">s: the Laplace variable. A pole of G is an eigenvalue of K, unless the input or the output cannot see that mode (then it cancels: an uncontrollable or unobservable mode).</p></div>
<div class="col"><ul class="b xs"><li>The Laplace transform turns a linear ODE system into linear algebra in s; (sI − K)⁻¹ is called the resolvent</li>
<li>Undergraduate process control used G(s) for one input and one output. The state form keeps every internal variable and generalizes to many inputs and outputs</li>
<li>Inverse transforms by partial fractions are the modal expansion of slide 6 in another notation</li>
<li>Frequency response G(iω) and Bode plots follow from the same expression; this course does not repeat them</li></ul></div></div>`});

S.push({kicker:"Part 3 · First-order networks", title:"Rate matrices: columns sum to zero, equilibrium is the null space", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
dx/dt = Kx, &nbsp;K<sub>ij</sub> = k<sub>ji</sub> (j → i) for i ≠ j, &nbsp;K<sub>jj</sub> = −Σ<sub>i≠j</sub>k<sub>ji</sub><br>
Columns sum to zero: 1ᵀK = 0 ⇒ λ = 0, 1ᵀx conserved<br>
Equilibrium x* ∈ N(K)<br>
Detailed balance: k<sub>ij</sub>x<sub>i</sub>* = k<sub>ji</sub>x<sub>j</sub>* for every pair<br>
⇒ D<sup>−1/2</sup>KD<sup>1/2</sup> is symmetric, D = diag(x*) ⇒ real λ ≤ 0</div></div>
<p class="note">k<sub>ij</sub>: rate constant of species i → j. Detailed balance (microscopic reversibility) holds at equilibrium for any elementary network.</p></div>
<div class="col"><ul class="b xs"><li>The symmetrization means a closed first-order network near equilibrium never oscillates: all eigenvalues are real and non-positive</li>
<li>Its eigenvectors are orthogonal in the inner product ⟨u, v⟩ = Σ u<sub>i</sub>v<sub>i</sub>/x<sub>i</sub>*, the weighted inner product of Session 1</li>
<li>One zero eigenvalue per closed group of species: its eigenvector is the equilibrium composition</li>
<li>These results (Wei and Prater, 1962) turned the analysis of complex isomerization networks into linear algebra, and then into experiments</li></ul></div></div>`});

S.push({kicker:"Part 3 · Invariants and lumping", title:"Zero eigenvalues, reaction invariants and lumped species", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
Invariant: wᵀx constant ⇔ wᵀK = 0 ⇔ w ∈ N(Kᵀ)<br>
Closed network: w = 1 (mass). Separate closed groups: one w per group<br>
Lumping: y = Lx with LK = K̂L ⇒ dy/dt = K̂y exactly<br>
Exact lumping exists iff the rows of L span a left-invariant subspace of K</div></div>
<p class="note">L: a lumping matrix (for example, “all butenes” or “all C<sub>4</sub> olefins”); K̂: the rate matrix of the lumped species. Wei and Kuo (1969) gave the conditions.</p></div>
<div class="col"><ul class="b xs"><li>The left null space of K is Session 1’s left null space of N, now for a dynamic model: the quantities no reaction can change</li>
<li>Lumping replaces many species by a few pseudo-species, as in refinery kinetics. It is exact only when the lumped rows span a subspace that K maps into itself, for example combinations of left eigenvectors</li>
<li>Approximate lumping keeps the slow modes and discards the fast ones: the same idea as quasi-steady states (Session 6)</li>
<li>Test any proposed lump by checking LK − K̂L = 0 numerically, before trusting its kinetics</li></ul></div></div>`});

(function(){if(!NARR)return;
 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};
 au.addEventListener("play",setPlayUI);au.addEventListener("pause",setPlayUI);
 au.addEventListener("timeupdate",()=>{tm.textContent=`${fmtT(au.currentTime)} / ${fmtT((S_(slideIdx)||{}).duration)}`;showCap(au.currentTime)});
 au.addEventListener("ended",()=>{setPlayUI();const s=S_(slideIdx);msg.textContent=s&&s.hold?"Activity: do it now, then press Next ›":cur<N-1?"Press Next › or → for the next slide":"End of the session"});
 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
