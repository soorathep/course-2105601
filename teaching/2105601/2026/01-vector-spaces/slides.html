0,0.0,0.0],"correction":[-0.00571108622620381,0.07082866741321392,-0.0077491601343784855,0.040593505039193456,-0.0065397536394177225],"chi2":4.020156774916008,"dof":3,"chi2_crit95":7.814727903251179,"xi":[0.6957110862262037,0.2834602463605821],"xi_residual":0.0,"CH4_conversion":0.6957110862262038,"H2_yield":2.3705935050391935,"orth_check":null}},"xi_raw":[0.6884615384615383,0.29615384615384605],"raw_residual":0.07795462190866603,"CH4_conversion_raw":0.69,"extended":{"species":["CH4","H2O","CO","H2","CO2","C(s)","CH3OH"],"rank":3,"dim_null":4,"basis":[[1,1,-1,-3,0,0,0],[1,-2,-4,0,3,0,0],[1,-2,2,0,0,-3,0],[2,2,1,0,0,0,-3]]}},"versions":{"numpy":"2.2.5","scipy":"1.14.1"}};
const LAB_FILE = "subspace_lab.py?v=s01-4b3fd978";
const LAB_SRC = "\"\"\"Session 1 (2026, semester 2): vector spaces, linear operators and the four fundamental subspaces.\n\nCourse notation, used in every function below:\n    A  atom (element) matrix, elements x species: A[e, s] = atoms of element e in species s\n    N  stoichiometric matrix, species x reactions: N[s, j] = coefficient of species s in reaction j\n       (products positive, reactants negative)\n    n  molar amounts or flows of the species; xi  extents of reaction;  n = n0 + N xi\nElement conservation is A n = A n0, so every column of N lies in the null space of A.\n\nRun `python subspace_lab.py` for a printed summary, or `python subspace_lab.py --json`\nto write subspace-results.json, which the slides and the lab page read.\n\"\"\"\nimport json\nimport sys\nfrom fractions import Fraction\n\nimport numpy as np\nfrom scipy.linalg import null_space, orth, svdvals\nfrom scipy.stats import chi2 as chi2_dist\n\nTOL = 1e-10          # numerical rank threshold relative to the largest singular value\n\n\ndef r6(v):\n    \"\"\"Round for printing, so recorded and live runs print the same text.\"\"\"\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\ndef num_rank(M, tol=TOL):\n    \"\"\"Numerical rank: number of singular values above tol * largest.\"\"\"\n    s = svdvals(np.asarray(M, float))\n    return int(np.sum(s > tol * s[0])) if s.size and s[0] > 0 else 0\n\n\ndef rref(M):\n    \"\"\"Exact reduced row echelon form with fractions; returns (R, pivot columns).\"\"\"\n    R = [[Fraction(x) for x in row] for row in M]\n    m, n = len(R), len(R[0])\n    piv, r = [], 0\n    for c in range(n):\n        p = next((i for i in range(r, m) if R[i][c] != 0), None)\n        if p is None:\n            continue\n        R[r], R[p] = R[p], R[r]\n        R[r] = [x / R[r][c] for x in R[r]]\n        for i in range(m):\n            if i != r and R[i][c] != 0:\n                R[i] = [a - R[i][c] * b for a, b in zip(R[i], R[r])]\n        piv.append(c); r += 1\n        if r == m:\n            break\n    return R, piv\n\n\ndef exact_null_basis(M):\n    \"\"\"Integer null-space basis from the RREF: one vector per free column.\"\"\"\n    R, piv = rref(M)\n    n = len(M[0]); free = [c for c in range(n) if c not in piv]\n    out = []\n    for f in free:\n        v = [Fraction(0)] * n; v[f] = Fraction(1)\n        for i, p in enumerate(piv):\n            v[p] = -R[i][f]\n        den = 1\n        for x in v:\n            den = den * x.denominator // np.gcd(den, x.denominator)\n        w = [int(x * den) for x in v]\n        if next(x for x in w if x != 0) < 0:\n            w = [-x for x in w]\n        out.append(w)\n    return {\"rref\": [[str(x) for x in row] for row in R], \"pivots\": piv, \"free\": free, \"basis\": out}\n\n\ndef subspaces(M):\n    \"\"\"Dimensions of the four fundamental subspaces of M (m x n) and orthonormal bases.\"\"\"\n    M = np.asarray(M, float); m, n = M.shape; r = num_rank(M)\n    return {\"shape\": [m, n], \"rank\": r, \"dim_col\": r, \"dim_row\": r, \"dim_null\": n - r, \"dim_left_null\": m - r,\n            \"sv\": svdvals(M).tolist(),\n            \"null\": null_space(M, rcond=TOL).T.tolist(), \"left_null\": null_space(M.T, rcond=TOL).T.tolist(),\n            \"col\": orth(M, rcond=TOL).T.tolist()}\n\n\n# ---------------------------------------------------------------------------\n# Part 1. Lecture example: methanol synthesis\n# ---------------------------------------------------------------------------\nMEOH = {\"species\": [\"CO\", \"CO2\", \"H2\", \"CH3OH\", \"H2O\"], \"elements\": [\"C\", \"H\", \"O\"],\n        \"A\": [[1, 1, 0, 1, 0],\n              [0, 0, 2, 4, 2],\n              [1, 2, 0, 1, 1]],\n        \"reactions\": {\"CO + 2 H2 -> CH3OH\": [-1, 0, -2, 1, 0],\n                      \"CO2 + H2 -> CO + H2O\": [1, -1, -1, 0, 1],\n                      \"CO2 + 3 H2 -> CH3OH + H2O\": [0, -1, -3, 1, 1]}}\n\n\nMEOH_REC = {\"n0\": [1.0, 0.3, 3.0, 0.0, 0.0],          # feed CO, CO2, H2, CH3OH, H2O, mol/s\n            \"xi_true\": [0.4, 0.1],                     # extents of CO + 2 H2 -> CH3OH and of reverse WGS (synthetic)\n            # SYNTHETIC measured outlet, mol/s, and the stated meter standard deviations\n            \"measured\": [0.71, 0.19, 2.16, 0.38, 0.11],\n            \"sigma\": [0.01, 0.01, 0.05, 0.01, 0.01]}\n\n\ndef methanol_reconciliation(sigma_h2=None):\n    \"\"\"Reconcile the synthetic methanol-reactor measurements; sigma_h2 overrides the H2 meter's sigma.\"\"\"\n    A = np.array(MEOH[\"A\"], float); n0 = np.array(MEOH_REC[\"n0\"]); b = A @ n0\n    sig = list(MEOH_REC[\"sigma\"])\n    if sigma_h2 is not None:\n        sig[2] = sigma_h2\n    N2 = np.array(list(MEOH[\"reactions\"].values())[:2], float).T\n    out = {\"n_true\": (n0 + N2 @ np.array(MEOH_REC[\"xi_true\"])).tolist(), \"b\": b.tolist(),\n           \"unweighted\": reconcile(A, MEOH_REC[\"measured\"], b), \"weighted\": reconcile(A, MEOH_REC[\"measured\"], b, sig)}\n    for k in (\"unweighted\", \"weighted\"):\n        xi, *_ = np.linalg.lstsq(N2, np.array(out[k][\"n_hat\"]) - n0, rcond=None)\n        out[k][\"xi\"] = xi.tolist()\n    return out\n\n\ndef methanol():\n    A = np.array(MEOH[\"A\"], float)\n    N = np.array(list(MEOH[\"reactions\"].values()), float).T          # species x reactions\n    SA, SN = subspaces(A), subspaces(N)\n    # conserved quantities: left null space of N equals the row space of A when the reactions span null(A)\n    LN = np.array(SN[\"left_null\"]); proj = LN.T @ np.linalg.lstsq(LN.T, A.T, rcond=None)[0]\n    return {\"A\": SA, \"N\": SN, \"AN_max\": float(np.abs(A @ N).max()), \"exact\": exact_null_basis(MEOH[\"A\"]),\n            \"rowA_in_leftnullN\": float(np.abs(proj - A.T).max()),\n            \"null_N_integer\": exact_null_basis(N.astype(int).tolist())[\"basis\"]}\n\n\n# ---------------------------------------------------------------------------\n# Part 2. Operators on function spaces: d/dx on polynomials, Gram matrices\n# ---------------------------------------------------------------------------\ndef derivative_operator(deg=3):\n    \"\"\"Matrix of d/dx on polynomials of degree <= deg in the monomial basis 1, x, ..., x^deg.\"\"\"\n    D = np.zeros((deg + 1, deg + 1))\n    for k in range(1, deg + 1):\n        D[k - 1, k] = k\n    S = subspaces(D)\n    return {\"deg\": deg, \"D\": D.tolist(), \"rank\": S[\"rank\"], \"dim_null\": S[\"dim_null\"], \"dim_left_null\": S[\"dim_left_null\"]}\n\n\ndef gram_monomials(n, a=0.0, b=1.0):\n    \"\"\"Gram matrix <x^i, x^j> = integral_a^b x^(i+j) dx for i, j < n (the Hilbert matrix on [0, 1]).\"\"\"\n    G = np.array([[(b ** (i + j + 1) - a ** (i + j + 1)) / (i + j + 1) for j in range(n)] for i in range(n)])\n    return G\n\n\ndef legendre_by_gram_schmidt(n=4):\n    \"\"\"Orthogonalize 1, x, x^2, ... on [-1, 1] through the Cholesky factor of the Gram matrix.\n    Returns monomial coefficients scaled so that p_k(1) = 1 (the Legendre polynomials).\"\"\"\n    G = gram_monomials(n, -1.0, 1.0)\n    L = np.linalg.cholesky(G)\n    C = np.linalg.inv(L).T                    # columns: orthonormal polynomials in the monomial basis\n    out = []\n    for k in range(n):\n        c = C[:, k]; c = c / c.sum()          # p_k(1) = sum of coefficients\n        out.append([0.0 if abs(x) < 1e-12 else float(x) for x in c])\n    return out\n\n\ndef hilbert_conditioning(nmax=10):\n    return [{\"n\": n, \"cond\": float(np.linalg.cond(gram_monomials(n)))} for n in range(2, nmax + 1)]\n\n\n# ---------------------------------------------------------------------------\n# Part 3. Lab: steam methane reforming network and data reconciliation\n# ---------------------------------------------------------------------------\nSMR = {\"species\": [\"CH4\", \"H2O\", \"CO\", \"H2\", \"CO2\"], \"elements\": [\"C\", \"H\", \"O\"],\n       \"A\": [[1, 0, 1, 0, 1],\n             [4, 2, 0, 2, 0],\n             [0, 1, 1, 0, 2]],\n       \"reactions\": {\"R1  CH4 + H2O -> CO + 3 H2\": [-1, -1, 1, 3, 0],\n                     \"R2  CO + H2O -> CO2 + H2\": [0, -1, -1, 1, 1],\n                     \"R3  CH4 + 2 H2O -> CO2 + 4 H2\": [-1, -2, 0, 4, 1]},\n       \"n0\": [1.0, 3.0, 0.0, 0.0, 0.0],             # feed, mol/s (steam-to-carbon ratio 3)\n       \"xi_true\": [0.70, 0.30],                     # extents of R1 and R2, mol/s (synthetic case)\n       # SYNTHETIC measurements of the outlet, mol/s: true outlet plus fixed errors of about 2 to 5 %\n       \"measured\": [0.31, 1.95, 0.42, 2.33, 0.29],\n       \"sigma\": [0.01, 0.05, 0.01, 0.05, 0.01]}     # stated standard deviations of the meters, mol/s\n\nEXT = {\"species\": [\"CH4\", \"H2O\", \"CO\", \"H2\", \"CO2\", \"C(s)\", \"CH3OH\"],\n       \"A\": [[1, 0, 1, 0, 1, 1, 1],\n             [4, 2, 0, 2, 0, 0, 4],\n             [0, 1, 1, 0, 2, 0, 1]]}\n\n\ndef reconcile(A, m, b, sigma=None):\n    \"\"\"Minimize sum ((n - m)_s / sigma_s)^2 subject to A n = b. Closed form:\n    n_hat = m - S A^T (A S A^T)^-1 (A m - b), with S = diag(sigma^2) (S = I when sigma is None).\"\"\"\n    A = np.asarray(A, float); m = np.asarray(m, float); b = np.asarray(b, float)\n    S = np.eye(len(m)) if sigma is None else np.diag(np.asarray(sigma, float) ** 2)\n    r = A @ m - b\n    lam = np.linalg.solve(A @ S @ A.T, r)\n    nh = m - S @ A.T @ lam\n    return {\"n_hat\": nh.tolist(), \"imbalance_before\": r.tolist(), \"imbalance_after\": (A @ nh - b).tolist(),\n            \"correction\": (nh - m).tolist(), \"chi2\": float(np.sum(((nh - m) ** 2) / np.diag(S))),\n            \"dof\": int(num_rank(A)), \"chi2_crit95\": float(chi2_dist.ppf(0.95, num_rank(A)))}\n\n\ndef lab_results():\n    A = np.array(SMR[\"A\"], float); N = np.array(list(SMR[\"reactions\"].values()), float).T\n    n0 = np.array(SMR[\"n0\"]); b = A @ n0\n    Nind = N[:, :2]\n    n_true = n0 + Nind @ np.array(SMR[\"xi_true\"])\n    SA, SN = subspaces(A), subspaces(N)\n    rec_u = reconcile(A, SMR[\"measured\"], b)\n    rec_w = reconcile(A, SMR[\"measured\"], b, SMR[\"sigma\"])\n    out = {}\n    for key, rec in ((\"unweighted\", rec_u), (\"weighted\", rec_w)):\n        dn = np.array(rec[\"n_hat\"]) - n0\n        xi, *_ = np.linalg.lstsq(Nind, dn, rcond=None)\n        P = np.eye(5) - A.T @ np.linalg.solve(A @ A.T, A)                 # projector onto null(A)\n        rec[\"xi\"] = xi.tolist()\n        rec[\"xi_residual\"] = float(np.linalg.norm(Nind @ xi - dn))\n        rec[\"CH4_conversion\"] = float(1 - rec[\"n_hat\"][0] / n0[0])\n        rec[\"H2_yield\"] = float(rec[\"n_hat\"][3] / n0[0])\n        rec[\"orth_check\"] = float(np.abs(P @ np.array(rec[\"correction\"])).max()) if key == \"unweighted\" else None\n        out[key] = rec\n    m = np.array(SMR[\"measured\"])\n    xi_raw, *_ = np.linalg.lstsq(Nind, m - n0, rcond=None)\n    SE = subspaces(EXT[\"A\"])\n    return {\"A\": SA, \"N\": SN, \"AN_max\": float(np.abs(A @ N).max()), \"exact\": exact_null_basis(SMR[\"A\"]),\n            \"R3_minus_R1_R2\": (N[:, 2] - N[:, 0] - N[:, 1]).tolist(),\n            \"n_true\": n_true.tolist(), \"b\": b.tolist(), \"measured\": SMR[\"measured\"], \"sigma\": SMR[\"sigma\"],\n            \"rec\": out, \"xi_raw\": xi_raw.tolist(), \"raw_residual\": float(np.linalg.norm(Nind @ xi_raw - (m - n0))),\n            \"CH4_conversion_raw\": float(1 - m[0] / n0[0]),\n            \"extended\": {\"species\": EXT[\"species\"], \"rank\": SE[\"rank\"], \"dim_null\": SE[\"dim_null\"],\n                         \"basis\": exact_null_basis(EXT[\"A\"])[\"basis\"]}}\n\n\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, (np.floating, float)):\n        v = float(o)\n        return 0.0 if abs(v) < 1e-14 else v\n    if isinstance(o, np.integer):\n        return int(o)\n    return o\n\n\ndef classroom_results():\n    R = {\"lecture\": {\"methanol\": methanol(), \"derivative\": derivative_operator(3),\n                     \"legendre\": legendre_by_gram_schmidt(4), \"hilbert\": hilbert_conditioning(10),\n                     \"meoh_rec\": methanol_reconciliation(),\n                     \"meoh_sweep\": [{\"s\": float(v), \"n_hat\": methanol_reconciliation(float(v))[\"weighted\"][\"n_hat\"]}\n                                    for v in np.round(np.arange(0.01, 0.2001, 0.01), 2)]},\n         \"lab\": lab_results(), \"versions\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__}}\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"subspace-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote subspace-results.json\"); sys.exit()\n    M = R[\"lecture\"][\"methanol\"]\n    print(\"1 methanol A rank\", M[\"A\"][\"rank\"], \"null\", M[\"A\"][\"dim_null\"], \"sv\", r6(M[\"A\"][\"sv\"]))\n    print(\"1 methanol exact null basis\", M[\"exact\"][\"basis\"], \"max|AN|\", M[\"AN_max\"])\n    print(\"1 methanol N rank\", M[\"N\"][\"rank\"], \"null\", M[\"N\"][\"dim_null\"], \"left null\", M[\"N\"][\"dim_left_null\"],\n          \"integer null(N)\", M[\"null_N_integer\"], \"row(A) in leftnull(N)\", r6(M[\"rowA_in_leftnullN\"]))\n    Q = R[\"lecture\"][\"meoh_rec\"]\n    for k in (\"unweighted\", \"weighted\"):\n        print(\"1 methanol\", k, \"n_hat\", r6(Q[k][\"n_hat\"]), \"xi\", r6(Q[k][\"xi\"]), \"imb\", r6(Q[k][\"imbalance_before\"]), \"chi2\", r6(Q[k][\"chi2\"]))\n    D = R[\"lecture\"][\"derivative\"]; print(\"2 d/dx on P3 rank\", D[\"rank\"], \"null\", D[\"dim_null\"], \"left null\", D[\"dim_left_null\"])\n    print(\"2 Legendre\", [r6(c) for c in R[\"lecture\"][\"legendre\"]])\n    print(\"2 Hilbert cond\", [(h[\"n\"], f\"{h['cond']:.3e}\") for h in R[\"lecture\"][\"hilbert\"]])\n    L = R[\"lab\"]\n    print(\"3 SMR A rank\", L[\"A\"][\"rank\"], \"null\", L[\"A\"][\"dim_null\"], \"exact basis\", L[\"exact\"][\"basis\"])\n    print(\"3 SMR N rank\", L[\"N\"][\"rank\"], \"R3-R1-R2\", L[\"R3_minus_R1_R2\"], \"max|AN|\", L[\"AN_max\"])\n    print(\"3 true outlet\", r6(L[\"n_true\"]), \"b\", r6(L[\"b\"]))\n    print(\"3 raw extents\", r6(L[\"xi_raw\"]), \"residual\", r6(L[\"raw_residual\"]), \"X_CH4 raw\", r6(L[\"CH4_conversion_raw\"]))\n    for k, q in L[\"rec\"].items():\n        print(\"3\", k, \"n_hat\", r6(q[\"n_hat\"]), \"imb before\", r6(q[\"imbalance_before\"]), \"after\", r6(q[\"imbalance_after\"]))\n        print(\"3\", k, \"xi\", r6(q[\"xi\"]), \"resid\", r6(q[\"xi_residual\"]), \"X_CH4\", r6(q[\"CH4_conversion\"]),\n              \"H2 yield\", r6(q[\"H2_yield\"]), \"chi2\", r6(q[\"chi2\"]), \"crit\", r6(q[\"chi2_crit95\"]), \"orth\", q[\"orth_check\"])\n    E = L[\"extended\"]; print(\"3 extended rank\", E[\"rank\"], \"null\", E[\"dim_null\"], \"basis\", E[\"basis\"])\n";   // embedded copy, so live Python also works when the file is opened locally

S.push({kicker:"Part 1 · Definitions", title:"A vector space: add and scale without leaving the set", html:()=>`<div class="body"><div class="col w45"><div class="panel"><div class="math" style="font-size:18px;line-height:1.7">
V is a vector space over ℝ if for all u, v ∈ V and α, β ∈ ℝ:<br>
u + v ∈ V and αu ∈ V (closure)<br>
with the usual rules: a zero vector 0, a negative −u, u + v = v + u, α(u + v) = αu + αv, (α + β)u = αu + βu<br>
A <b>subspace</b> W ⊆ V: 0 ∈ W and αu + βv ∈ W for all u, v ∈ W</div></div>
<p class="note">One test does the work for a subspace: every linear combination of members is a member. A set that misses the zero vector fails at once.</p></div>
<div class="col"><table class="t" style="font-size:17px"><tr><th>Space</th><th>Its vectors</th><th class="n">Dimension</th></tr>
<tr><td>ℝⁿ</td><td>Columns of n numbers, such as the molar flows of n species</td><td class="n">n</td></tr>
<tr><td>P<sub>k</sub></td><td>Polynomials of degree ≤ k, such as a c<sub>p</sub>(T) correlation</td><td class="n">k + 1</td></tr>
<tr><td>C[a, b]</td><td>Continuous functions on [a, b], such as a concentration profile c(z)</td><td class="n">∞</td></tr>
<tr><td>N(A)</td><td>Solutions of Aν = 0: the balanced reactions</td><td class="n">n − rank A</td></tr>
<tr><td>{y : y″ + y = 0}</td><td>Solutions of a homogeneous linear ODE</td><td class="n">2</td></tr></table>
<p class="note">Session 7 works in C[a, b] and its relatives. The rules are the same as in ℝⁿ; only the dimension is infinite.</p></div></div>`});

const SUBSETS=[
 {t:"Mole-fraction vectors: x ≥ 0 and Σx<sub>i</sub> = 1",ok:false,why:"No. 0 is not in the set, and 2x has Σ = 2. It is a convex set (a simplex), not a subspace"},
 {t:"Balanced reactions: all ν with Aν = 0",ok:true,why:"Yes. A(αν + βμ) = αAν + βAμ = 0. It is the null space N(A)"},
 {t:"Outlet flows that satisfy the balances: An = An<sub>0</sub>, with An<sub>0</sub> ≠ 0",ok:false,why:"No. It is an affine set: n<sub>0</sub> plus the subspace N(A). It does not contain 0"},
 {t:"Solutions of y″ + y = 0 on [0, π]",ok:true,why:"Yes. The equation is linear and homogeneous; every solution is a cos t + b sin t, dimension 2"},
 {t:"Solutions of y″ + y = 1",ok:false,why:"No. The sum of two solutions solves y″ + y = 2. The set is a particular solution plus the space above"},
 {t:"Polynomials in P<sub>3</sub> with p(0) = 0",ok:true,why:"Yes. The condition is linear and homogeneous; a basis is x, x², x³, dimension 3"},
 {t:"Polynomials in P<sub>3</sub> with p(1) = 1",ok:false,why:"No. The zero polynomial fails; the condition is not homogeneous"}];

S.push({kicker:"Part 1 · Basis and dimension", title:"A basis gives every vector one set of coordinates", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
Span: span{v<sub>1</sub>, …, v<sub>k</sub>} = {c<sub>1</sub>v<sub>1</sub> + … + c<sub>k</sub>v<sub>k</sub>}<br>
Independent: c<sub>1</sub>v<sub>1</sub> + … + c<sub>k</sub>v<sub>k</sub> = 0 only for c = 0<br>
Basis of V: independent and spans V<br>
Every basis of V has the same number of vectors: dim V<br>
Coordinates: v = Σ c<sub>i</sub>v<sub>i</sub>, and c is unique</div></div>
<p class="note">v<sub>i</sub>: basis vectors; c<sub>i</sub>: coordinates of v in that basis. A change of basis changes the coordinates, not the vector.</p></div>
<div class="col"><ul class="b xs"><li>The coordinates depend on the basis. Composition in mole fractions and in mass fractions describes the same mixture in two bases (after normalization)</li>
<li>In P<sub>2</sub>, the monomials 1, x, x² and the Legendre polynomials 1, x, (3x² − 1)/2 are both bases. A fit gives different coefficients in each, and the same curve</li>
<li>For the null space of an atom matrix, a basis is a set of independent reactions. Many sets are valid; their number is fixed</li>
<li>The choice of basis is a modeling decision. Session 2 chooses the basis that makes an operator diagonal; Session 7 chooses the eigenfunctions of a differential operator</li></ul></div></div>`});

S.push({kicker:"Part 1 · Linear operators", title:"A linear operator, and its matrix in a basis", html:()=>{const D=LC().derivative;return `<div class="body"><div class="col w45"><div class="panel"><div class="math" style="font-size:18px;line-height:1.7">
L : V → W is linear if L(αu + βv) = αLu + βLv<br>
Choose bases v<sub>1</sub>, …, v<sub>n</sub> of V and w<sub>1</sub>, …, w<sub>m</sub> of W<br>
Column j of the matrix = coordinates of Lv<sub>j</sub><br>
Example: L = d/dx on P<sub>3</sub>, basis 1, x, x², x³<br>
d/dx(x<sup>k</sup>) = k x<sup>k−1</sup></div></div>
<div style="margin-top:10px">${mat(D.D,["1","x","x²","x³"],["1","x","x²","x³"],{fs:17})}</div></div>
<div class="col"><ul class="b xs"><li>Rank ${D.rank}: the image of d/dx on P<sub>3</sub> is P<sub>2</sub></li>
<li>Null space of dimension ${D.dim_null}: the constants. This is why an antiderivative has “+ C”</li>
<li>Left null space of dimension ${D.dim_left_null}: the x³ coordinate of the output is always zero. Lp = q has a solution only if q has no x³ term, a first example of a solvability condition</li>

S.push({kicker:"Part 1 · Inner products", title:"Inner products, orthogonality and Gram–Schmidt", html:()=>{const P=LC().legendre;const t=c=>{const s=[];c.forEach((v,k)=>{if(v!==0){const c=mn(fmt(v,1)),x=k?(k===1?"x":`x${k===2?"²":"³"}`):"";s.push(k&&c==="1.0"?x:k?`${c} ${x}`:c.replace(/^1\.0$/,"1"))}});return s.join(" + ").replace(/\+ −/g,"− ")};

⟨u, v⟩ = uᵀv in ℝⁿ; &nbsp;⟨f, g⟩ = ∫<sub>a</sub><sup>b</sup> f(x) g(x) w(x) dx in C[a, b]<br>
‖u‖ = ⟨u, u⟩<sup>1/2</sup>; &nbsp;orthogonal: ⟨u, v⟩ = 0<br>
Gram matrix of a basis: G<sub>ij</sub> = ⟨v<sub>i</sub>, v<sub>j</sub>⟩<br>
Gram–Schmidt: q<sub>k</sub> = v<sub>k</sub> − Σ<sub>j&lt;k</sub> ⟨v<sub>k</sub>, q<sub>j</sub>⟩/⟨q<sub>j</sub>, q<sub>j</sub>⟩ q<sub>j</sub><br>
Equivalent: Cholesky G = LLᵀ, new basis coefficients L⁻ᵀ</div></div>
<p class="note">w(x) &gt; 0: a weight function; w = 1 here. Session 7 uses w = x for a cylinder and w = x² for a sphere.</p></div>
<div class="col"><table class="t" style="font-size:17px"><tr><th>Gram–Schmidt on 1, x, x², x³ over [−1, 1]</th></tr>

<ul class="b xs" style="margin-top:10px"><li>Scaled so that P<sub>k</sub>(1) = 1, these are the Legendre polynomials</li>
<li>In an orthogonal basis each coordinate is one inner product: c<sub>k</sub> = ⟨f, P<sub>k</sub>⟩/⟨P<sub>k</sub>, P<sub>k</sub>⟩. No system of equations to solve</li></ul></div></div>`},

S.push({kicker:"Part 1 · Why orthogonal bases", title:"Monomials are a legal basis and a poor one", html:()=>`<div class="body"><div class="col w55"><div class="panel grow"><div class="chart" id="ch-hil"></div></div></div>
<div class="col"><ul class="b xs"><li>Fitting a polynomial of degree n − 1 in 1, x, …, x<sup>n−1</sup> on [0, 1] by least squares solves Gc = r with G the Gram matrix of the monomials, the Hilbert matrix</li>
<li id="hilk"></li>
<li>The condition number κ bounds how much relative error in the data can grow in the coefficients. With 16-digit arithmetic, κ ≈ 10<sup>13</sup> leaves about 3 reliable digits</li>

S.push({kicker:"Part 2 · Two theorems", title:"Rank–nullity, and why the pairs are orthogonal", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
<b>Rank–nullity.</b> dim C(M) + dim N(M) = n<br>
Proof in outline: row reduce M to its echelon form U; Ux = 0 has the same solutions. U has r pivot columns and n − r free columns. Each free variable set to 1 (the others 0) gives one null-space vector; these n − r vectors are independent and span N(M)<br>
<b>Orthogonality.</b> x ∈ N(M) means every row m<sub>i</sub>ᵀ of M has m<sub>i</sub>ᵀx = 0. So x is orthogonal to every row, and to every combination of rows: N(M) ⊥ C(Mᵀ)</div></div></div>
<div class="col"><ul class="b xs"><li>The same argument on Mᵀ gives N(Mᵀ) ⊥ C(M) and dim N(Mᵀ) = m − r</li>
<li>Row rank equals column rank: both count the pivots of U</li>
<li>Consequences for a model with n unknowns and m equations: if r = n the solution, when it exists, is unique; if r = m a solution exists for every right-hand side</li>
<li>The free-column construction is how the lab finds an integer basis of balanced reactions</li>
<li>In infinite dimensions the counting needs care (Session 7), but the orthogonality survives and gives the Fredholm alternative</li></ul></div></div>`});

S.push({kicker:"Part 2 · Solvability", title:"When Mx = b has a solution: the Fredholm alternative", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
Mx = b has a solution &nbsp;⇔ &nbsp;b ∈ C(M) &nbsp;⇔ &nbsp;yᵀb = 0 for every y ∈ N(Mᵀ)<br>
Exactly one of these holds:<br>
(i) Mx = b has a solution, or<br>
(ii) there is y with Mᵀy = 0 and yᵀb ≠ 0<br>
If a solution x<sub>p</sub> exists, all solutions are x<sub>p</sub> + N(M)</div></div>
<p class="note">Proof of ⇐: C(M) and N(Mᵀ) are orthogonal and together fill ℝᵐ, so a b orthogonal to N(Mᵀ) has no part outside C(M).</p></div>
<div class="col"><ul class="b xs"><li>The left null space holds the <b>compatibility conditions</b>: m − r linear tests that b must pass before you try to solve</li>
<li>Chemistry: a measured change in moles Δn is consistent with the reactions only if it passes one test per conserved quantity. Part 3 shows these tests are the element balances</li>
<li>Session 7: a boundary value problem Ly = f has a solution only if f is orthogonal to the null space of the adjoint operator. A heat equation with insulated ends needs ∫ source = 0 at steady state</li>
<li>When (ii) holds the equations contradict each other; no solver can fix that, only a change in the model or the data</li></ul></div></div>`});

S.push({kicker:"Part 2 · Least squares", title:"When b is not in C(M): project it", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
minimize ‖Mx − b‖<sup>2</sup><br>
At the optimum the residual e = b − Mx̂ is orthogonal to C(M): Mᵀe = 0<br>
Normal equations: MᵀM x̂ = Mᵀb<br>
Projection p = Mx̂ = P b, &nbsp;P = M(MᵀM)⁻¹Mᵀ (rank M = n)<br>
P² = P, &nbsp;Pᵀ = P; &nbsp;I − P projects onto N(Mᵀ)</div></div>
<p class="note">x̂: the least-squares solution; p: the closest point of C(M) to b; P: the orthogonal projector. If rank M &lt; n, x̂ is not unique; the pseudoinverse picks the one of smallest norm.</p></div>
<div class="col"><ul class="b xs"><li>Every term has a picture in the four-subspace diagram: p lives in C(M), e lives in N(Mᵀ)</li>
<li>Do not form MᵀM in floating point when M is poorly conditioned: κ(MᵀM) = κ(M)². Use QR or the SVD (Session 2)</li>
<li>Kinetic fits, calibration curves and the reconciliation of Part 3 are all orthogonal projections, in a suitable inner product</li>
<li>A weighted problem, minimize (Mx − b)ᵀW(Mx − b), is the same projection in the inner product ⟨u, v⟩ = uᵀWv</li></ul></div></div>`});

S.push({kicker:"Part 3 · Stoichiometry", title:"Atom matrix and stoichiometric matrix: AN = 0", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
A ∈ ℝ<sup>E×S</sup>: A<sub>es</sub> = atoms of element e in species s<br>
N ∈ ℝ<sup>S×R</sup>: N<sub>sj</sub> = coefficient of species s in reaction j<br>
n = n<sub>0</sub> + Nξ &nbsp;(batch moles or steady flows)<br>
Element balance: An = An<sub>0</sub> for every ξ &nbsp;⇔ &nbsp;<b>AN = 0</b><br>
So C(N) ⊆ N(A), and rank N ≤ S − rank A</div></div>
<p class="note">E: elements; S: species; R: reactions written; ξ ∈ ℝ<sup>R</sup>: extents. Charge, or a conserved site balance on a catalyst, adds a row to A.</p></div>
<div class="col"><ul class="b xs"><li>The <b>number of independent reactions</b> is rank N. It is at most S − rank A, and equals it when the reactions can produce every balanced change (Aris, 1965; Smith and Missen, 1982)</li>
<li>Kinetic mechanisms may contain fewer: a model with only one reaction for a system that allows two restricts which compositions it can reach</li>
<li>Two sets of reactions with the same column space describe the same reachable compositions. Which set to use is a kinetic question, not a stoichiometric one</li>
<li>This is why a Gibbs energy minimization needs only A and no list of reactions: it searches the same set n<sub>0</sub> + N(A)</li></ul></div></div>`});

S.push({kicker:"Part 3 · Data reconciliation", title:"Measured flows violate the balances: project them back", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
Measured outlet m; feed n<sub>0</sub>; meter variances Σ = diag(σ<sub>s</sub>²)<br>
minimize (n − m)ᵀ Σ⁻¹ (n − m) &nbsp;s.t. &nbsp;An = An<sub>0</sub><br>
n̂ = m − ΣAᵀ(AΣAᵀ)⁻¹(Am − An<sub>0</sub>)<br>
n̂ − m ∈ C(ΣAᵀ); &nbsp;An̂ = An<sub>0</sub> exactly<br>
χ² = (n̂ − m)ᵀΣ⁻¹(n̂ − m), &nbsp;rank A degrees of freedom</div></div>
<p class="note">n̂: reconciled flows; Am − An<sub>0</sub>: the imbalance of each element. Derivation: a Lagrangian with one multiplier per element balance; the course on optimization treats it in general.</p></div>
<div class="col"><ul class="b xs"><li>With Σ = I, n̂ is the orthogonal projection of m onto the affine set n<sub>0</sub> + N(A); the correction lies in the row space C(Aᵀ)</li>
<li>With unequal σ, it is the orthogonal projection in the inner product ⟨u, v⟩ = uᵀΣ⁻¹v: accurate meters move little, poor meters absorb the correction</li>
<li>Then ξ̂ follows from n̂ − n<sub>0</sub> = Nξ, which now has an exact solution</li>
<li>χ² is a global test for gross error: compare it with the 95% point of χ² with rank A degrees of freedom (Narasimhan and Jordache, 2000)</li>
<li>The method needs only the balances, not the kinetics. It applies to any linear constraint set: elements, total mass, a splitter</li></ul></div></div>`});

<tr><td>κ of the monomial Gram matrix, degree 9</td><td class="n">${pyExp(H.find(q=>q.n===10).cond,1).replace("e+","×10^").replace(/\^(\d+)/,"<sup>$1</sup>")}</td></tr>
<tr><td>Methanol: rank A, dim N(A)</td><td class="n">${M.A.rank}, ${M.A.dim_null}</td></tr>
<tr><td>Methanol: rank N for R1 to R3</td><td class="n">${M.N.rank}</td></tr>
<tr><td>Methanol: conserved quantities</td><td class="n">${M.N.dim_left_null} (C, H, O)</td></tr>
<tr><td>Reconciled CH<sub>3</sub>OH, weighted</td><td class="n">${fmt(Q.weighted.n_hat[3],4)} mol/s</td></tr>
<tr><td>χ², 3 degrees of freedom</td><td class="n">${fmt(Q.weighted.chi2,2)} &lt; 7.81</td></tr></table></div>
<div class="col"><ul class="b xs"><li>A subspace is closed under linear combinations; a nonzero right-hand side gives an affine set</li>
<li>An operator exists before its matrix; rank and nullity do not depend on the basis</li>
<li>Orthogonal bases make coordinates one inner product each, and keep the Gram matrix well conditioned</li>
<li>Four subspaces: C(M) and N(Mᵀ) in ℝᵐ, C(Mᵀ) and N(M) in ℝⁿ; r, m − r, r, n − r; orthogonal in pairs</li>
<li>Mx = b is solvable when b ⊥ N(Mᵀ); solutions are unique up to N(M); least squares projects b onto C(M)</li>
<li>Independent reactions: rank N ≤ S − rank A. Conserved quantities: N(Nᵀ). Reconciliation: projection onto n<sub>0</sub> + N(A)</li></ul></div></div>`}});

S.push({kicker:"Before the next session", title:"Before we meet again", html:()=>`<div class="body"><div class="col"><ul class="b sm">
<li>Finish Lab 1 if you did not finish in class, and upload the answer file to myCourseVille</li>
<li>Keep your card: Session 2 adds the parameters you fit and asks whether your data can identify them</li>
<li>Read Strang, <i>Linear Algebra and Its Applications</i>, Chapter 2 (vector spaces and the four fundamental subspaces) and Section 3.3 (projections and least squares)</li>
<li>Read Varma and Morbidelli, <i>Mathematical Methods in Chemical Engineering</i>, Chapter 1 (matrices and their application)</li>
<li>For the stoichiometry: Aris, <i>Elementary Chemical Reactor Analysis</i>, Chapter 2, or Smith and Missen, <i>Chemical Reaction Equilibrium Analysis</i>, Chapter 2</li>
<li>Optional: Narasimhan and Jordache, <i>Data Reconciliation and Gross Error Detection</i>, Chapter 3, on linear reconciliation</li></ul></div></div>`});

 history.replaceState(null,"",location.search+"#"+(cur+1));fillDrawer();if(window.onSlideChange)onSlideChange(cur);const n=document.getElementById("notes");n.textContent=S[cur].notes||"No notes for this slide."}

function fit(){const W=innerWidth,H=innerHeight,vp=document.getElementById("viewport"),dock=document.getElementById("dock"),cap=document.getElementById("cap");
 const hasDock=dock.style.display==="flex",barH=hasDock?document.getElementById("nbar").offsetHeight:0;
 let k=Math.min(W/1280,H/720)*0.98,capH=0,fs=0,dockH=0;
 for(let it=0;it<3;it++){if(hasDock&&CAP_ON){const lines=k<0.6?4:2;fs=Math.max(12,Math.min(22,24*k));capH=Math.ceil(lines*fs*1.45)+4}else capH=0;
  dockH=hasDock?capH+barH+(capH?6:0)+14:0;k=Math.min(W/1280,Math.max(120,H-dockH)/720)*0.98}
 const h=720*k,pad=10,top=Math.max(0,(H-h-dockH)/2);
 vp.style.top=(top-pad)+"px";vp.style.bottom="auto";vp.style.height=(h+2*pad)+"px";
 document.getElementById("stage").style.transform=`scale(${k})`;
 if(hasDock){dock.style.top=(top+h+6)+"px";cap.style.display=CAP_ON?"block":"none";cap.style.width=Math.min(1280*k,W-16)+"px";cap.style.height=capH+"px";cap.dataset.fs=fs;if(window.capRefit)capRefit()}}

 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
