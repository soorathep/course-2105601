const LAB_SRC = "\"\"\"Session 4 (2026, semester 2): nonlinear ODEs, linearization, stability and the phase plane.\n\nModel: the nonadiabatic CSTR with a first-order exothermic reaction in dimensionless form\n(Uppal, Ray and Poore, 1974, in the limit of large activation energy):\n    dx1/dt = -x1 + Da (1 - x1) exp(x2)                 conversion x1\n    dx2/dt = -x2 + B Da (1 - x1) exp(x2) - beta x2     dimensionless temperature rise x2\nDa: Damkohler number; B: adiabatic temperature rise; beta: heat-transfer coefficient.\nCourse notation: x* a steady state, J = df/dx at x*, eigenvalues lambda of J (Sessions 2 and 3).\n\nRun `python stability_lab.py` for a summary, or `python stability_lab.py --json` to write stability-results.json.\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy.integrate import solve_ivp\nfrom scipy.optimize import brentq\n\nP = {\"B\": 8.0, \"beta\": 0.3}\nDA_LECTURE, DA_LAB = 0.06, 0.045\n\n\ndef r6(v):\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\ndef sig(v, n=4):\n    return f\"{float(v):.{n}g}\"\n\n\ndef f(x, Da, B=P[\"B\"], beta=P[\"beta\"]):\n    r = Da * (1 - x[0]) * np.exp(x[1])\n    return np.array([-x[0] + r, -x[1] + B * r - beta * x[1]])\n\n\ndef jac(x, Da, B=P[\"B\"], beta=P[\"beta\"]):\n    e = np.exp(x[1])\n    return np.array([[-1 - Da * e, Da * (1 - x[0]) * e], [-B * Da * e, -1 - beta + B * Da * (1 - x[0]) * e]])\n\n\ndef steady_states(Da, B=P[\"B\"], beta=P[\"beta\"]):\n    \"\"\"At steady state x2 = B x1/(1 + beta); solve g(x1) = 0 on [0, 1) by bracketing.\"\"\"\n    g = lambda x1: x1 - Da * (1 - x1) * np.exp(B * x1 / (1 + beta))\n    xs = np.linspace(0, 1 - 1e-9, 20001); v = g(xs)\n    roots = [brentq(g, xs[i], xs[i + 1], xtol=1e-14) for i in range(len(xs) - 1) if v[i] * v[i + 1] < 0]\n    return [np.array([x1, B * x1 / (1 + beta)]) for x1 in roots]\n\n\ndef classify(w):\n    re, im = np.real(w), np.imag(w)\n    if np.all(re < 0):\n        return \"stable focus\" if np.any(np.abs(im) > 1e-12) else \"stable node\"\n    if np.all(re > 0):\n        return \"unstable focus\" if np.any(np.abs(im) > 1e-12) else \"unstable node\"\n    return \"saddle\"\n\n\ndef analyse(Da):\n    out = []\n    for x in steady_states(Da):\n        J = jac(x, Da); w = np.linalg.eigvals(J)\n        w = w[np.argsort(-w.real)]\n        out.append({\"x\": x.tolist(), \"J\": J.tolist(), \"tr\": float(np.trace(J)), \"det\": float(np.linalg.det(J)),\n                    \"lam_re\": np.real(w).tolist(), \"lam_im\": np.imag(w).tolist(), \"type\": classify(w),\n                    \"residual\": float(np.abs(f(x, Da)).max())})\n    return out\n\n\ndef heat_curves(Da, B=P[\"B\"], beta=P[\"beta\"]):\n    \"\"\"Van Heerden view: generation G(x2) = B Da e/(1 + Da e) against removal R(x2) = (1 + beta) x2.\"\"\"\n    x2 = np.linspace(0, 8, 161); e = np.exp(x2)\n    return {\"x2\": x2.tolist(), \"G\": (B * Da * e / (1 + Da * e)).tolist(), \"R\": ((1 + beta) * x2).tolist()}\n\n\ndef trajectories(Da, starts, tmax=30.0):\n    out = []\n    for s in starts:\n        sol = solve_ivp(lambda t, x: f(x, Da), (0, tmax), s, rtol=1e-9, atol=1e-11, method=\"LSODA\", dense_output=True)\n        t = np.linspace(0, tmax, 301)\n        X = sol.sol(t).T\n        out.append({\"x0\": list(map(float, s)), \"X\": X.tolist(), \"end\": X[-1].tolist()})\n    return out\n\n\ndef separatrix(Da):\n    \"\"\"Stable manifold of the saddle: integrate backward in time from the saddle along its stable eigenvector.\"\"\"\n    sad = [s for s in analyse(Da) if s[\"type\"] == \"saddle\"][0]\n    x = np.array(sad[\"x\"]); w, V = np.linalg.eig(np.array(sad[\"J\"]))\n    v = V[:, np.argmin(w.real)].real\n    branches = []\n    def leave(t, z):                       # stop when the backward path leaves the window 0 <= x1 <= 1, -0.5 <= x2 <= 8.5\n        return min(z[0], 1.0 - z[0], z[1] + 0.5, 8.5 - z[1])\n    leave.terminal = True\n    for sgn in (1, -1):\n        sol = solve_ivp(lambda t, z: -f(z, Da), (0, 12), x + sgn * 1e-4 * v, rtol=1e-9, atol=1e-11, method=\"LSODA\",\n                        events=leave, max_step=0.05)\n        branches.append(sol.y.T[::max(1, sol.y.shape[1] // 300)].tolist())\n    unstable = []\n    u = V[:, np.argmax(w.real)].real\n    for sgn in (1, -1):\n        sol = solve_ivp(lambda t, z: f(z, Da), (0, 30), x + sgn * 1e-3 * u, rtol=1e-9, atol=1e-11, method=\"LSODA\")\n        unstable.append({\"end\": sol.y[:, -1].tolist(), \"X\": sol.y.T[::max(1, sol.y.shape[1] // 300)].tolist()})\n    return {\"saddle\": sad[\"x\"], \"stable_branches\": branches, \"unstable\": unstable}\n\n\ndef transient_growth():\n    \"\"\"A stable but non-normal linear system: ||exp(Jt)|| rises before it decays (Session 2).\"\"\"\n    from scipy.linalg import expm\n    J = np.array([[-1.0, 20.0], [0.0, -2.0]])\n    t = np.linspace(0, 6, 121)\n    g = [float(np.linalg.norm(expm(J * s), 2)) for s in t]\n    k = int(np.argmax(g))\n    return {\"J\": J.tolist(), \"t\": t.tolist(), \"g\": g, \"gmax\": g[k], \"tmax\": float(t[k])}\n\n\ndef da_sweep():\n    out = []\n    for Da in np.round(np.arange(0.010, 0.0901, 0.0025), 4):\n        S = analyse(float(Da))\n        out.append({\"Da\": float(Da), \"n\": len(S), \"x2\": [s[\"x\"][1] for s in S], \"types\": [s[\"type\"] for s in S],\n                    \"maxre\": [s[\"lam_re\"][0] for s in S]})\n    return out\n\n\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, (np.floating, float)):\n        v = float(o)\n        return 0.0 if abs(v) < 1e-14 else v\n    if isinstance(o, np.integer):\n        return int(o)\n    return o\n\n\ndef ignition_threshold(Da, x10=0.0, lo=0.0, hi=8.0, tol=1e-6):\n    \"\"\"Smallest initial temperature x2(0), with x1(0) = x10, from which the reactor ends at the hot steady state (bisection).\"\"\"\n    S = analyse(Da); x2s = [s[\"x\"][1] for s in S]; sad = [s for s in S if s[\"type\"] == \"saddle\"][0][\"x\"][1]\n    def hot(x20):\n        sol = solve_ivp(lambda t, x: f(x, Da), (0, 60), [x10, x20], rtol=1e-9, atol=1e-11, method=\"LSODA\")\n        return sol.y[1, -1] > sad\n    assert not hot(lo) and hot(hi)\n    while hi - lo > tol:\n        mid = 0.5 * (lo + hi)\n        lo, hi = (lo, mid) if hot(mid) else (mid, hi)\n    return {\"Da\": Da, \"x10\": x10, \"x20\": 0.5 * (lo + hi), \"steady_x2\": x2s}\n\n\ndef classroom_results():\n    grid = [[a, b] for a in (0.0, 0.5, 1.0) for b in (0.0, 4.0, 8.0)]\n    lab_starts = []\n    S = analyse(DA_LAB); sad = [s for s in S if s[\"type\"] == \"saddle\"][0]\n    w, V = np.linalg.eig(np.array(sad[\"J\"])); u = V[:, np.argmax(w.real)].real\n    for sgn in (1, -1):\n        lab_starts.append((np.array(sad[\"x\"]) + sgn * 0.02 * u).tolist())\n    R = {\"lecture\": {\"P\": P, \"Da\": DA_LECTURE, \"ss\": analyse(DA_LECTURE), \"heat\": heat_curves(DA_LECTURE),\n                     \"traj\": trajectories(DA_LECTURE, grid), \"sep\": separatrix(DA_LECTURE), \"tg\": transient_growth()},\n         \"lab\": {\"Da\": DA_LAB, \"ss\": S, \"kick\": trajectories(DA_LAB, lab_starts), \"sweep\": da_sweep(),\n                 \"heat\": heat_curves(DA_LAB), \"sep\": separatrix(DA_LAB), \"ign\": ignition_threshold(DA_LAB)},\n         \"versions\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__}}\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"stability-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote stability-results.json\"); sys.exit()\n    for key in (\"lecture\", \"lab\"):\n        L = R[key]; print(key, \"Da\", L[\"Da\"])\n        for s in L[\"ss\"]:\n            print(\"  x*\", r6(s[\"x\"]), \"lam\", r6(s[\"lam_re\"]), r6(s[\"lam_im\"]), s[\"type\"], \"res\", sig(s[\"residual\"]))\n    print(\"traj ends\", [r6(q[\"end\"]) for q in R[\"lecture\"][\"traj\"]])\n    print(\"lab kick ends\", [r6(q[\"end\"]) for q in R[\"lab\"][\"kick\"]])\n    print(\"tg\", r6(R[\"lecture\"][\"tg\"][\"gmax\"]), r6(R[\"lecture\"][\"tg\"][\"tmax\"]))\n    print(\"sweep\", [(q[\"Da\"], q[\"n\"]) for q in R[\"lab\"][\"sweep\"]])\n";   // embedded copy, so live Python also works when the file is opened locally

const C = {teal:"#0F6E6B",amber:"#E29A2D",rust:"#BE654C",sky:"#5A91BE",sage:"#83A462",plum:"#995A90",graphite:"#333F4A",sand:"#DFC98F",ink:"#1C242B",slate:"#66727C",mist:"#B9C1C6",paper:"#F3F0EB"};

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}
function legendRow(items,x,y){let s="",xx=x;items.forEach(it=>{s+=it.line?`<line x1="${xx}" x2="${xx+20}" y1="${y}" y2="${y}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${xx}" y="${y-7}" width="14" height="14" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${xx+26}" y="${y+5}" font-size="16" fill="${C.ink}">${it.t}</text>`;xx+=38+it.t.length*8.2});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

function nullclines(P,Da,B,beta){let a="",b="";for(let i=0;i<=200;i++){const x2=8*i/200,e=Da*Math.exp(x2),x1a=e/(1+e),x1b=1-(1+beta)*x2/(B*e);
  a+=(i?"L":"M")+P.px(x1a).toFixed(1)+","+P.py(x2).toFixed(1);if(x1b>=0&&x1b<=1)b+=(b?"L":"M")+P.px(x1b).toFixed(1)+","+P.py(x2).toFixed(1)}
 return `<path d="${a}" fill="none" stroke="${C.sky}" stroke-width="2.2" stroke-dasharray="7 4"/><path d="${b}" fill="none" stroke="${C.sage}" stroke-width="2.2" stroke-dasharray="7 4"/>`}
const poly=(P,X,c,w,o)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" ${o?`opacity="${o}"`:""} points="${X.filter(p=>p[1]>=-0.2&&p[1]<=8.2).map(p=>P.px(Math.max(0,Math.min(1,p[0]))).toFixed(1)+","+P.py(p[1]).toFixed(1)).join(" ")}"/>`;

S.push({kicker:"Part 2 · Basins of attraction", title:"The separatrix decides where the reactor goes", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
Stable manifold of a saddle x<sub>s</sub>: all states whose trajectory tends to x<sub>s</sub><br>
Compute it by integrating backward in time from x<sub>s</sub> ± εv<sub>stable</sub><br>
Unstable manifold: forward from x<sub>s</sub> ± εv<sub>unstable</sub>; it connects the saddle to the two stable states</div></div>
<p class="note">ε: a small step (10⁻⁴ here) along the eigenvector of the saddle’s negative eigenvalue. Backward integration makes the stable direction unstable, so the solver follows it.</p></div>
<div class="col"><ul class="b xs"><li>In two dimensions the stable manifold of a saddle is a curve, and it is the boundary between basins: a state just on one side goes to the cold steady state, just on the other side to the hot one</li>
<li>Large disturbances matter, not just small ones: a short loss of cooling can push the state across the separatrix, and the reactor ignites even after the cooling returns</li>
<li>The saddle itself is never seen in operation; the slightest disturbance moves the state off it along the unstable manifold</li>
<li>In more than two dimensions the separatrix becomes a surface, and simulation from many starts is the practical tool</li></ul></div></div>`});

S.push({kicker:"Part 3 · Beyond linearization", title:"Lyapunov functions: stability without solving", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
V(x) &gt; 0 for x ≠ x*, V(x*) = 0<br>
dV/dt = ∇V · f(x) ≤ 0 ⇒ x* stable; &lt; 0 for x ≠ x* ⇒ asymptotically stable<br>
If V → ∞ as ‖x‖ → ∞ and dV/dt &lt; 0 everywhere else: globally stable<br>
Linear case: V = xᵀPx with JᵀP + PJ = −Q, Q positive definite</div></div>
<p class="note">V: a Lyapunov function, an energy-like quantity that never increases along trajectories. The linear version gives the eigenvalue test back.</p></div>
<div class="col"><ul class="b xs"><li>A Lyapunov function proves stability when the linearization says nothing (Re λ = 0) and estimates the size of a basin: any sublevel set of V where dV/dt &lt; 0 lies inside it</li>
<li>Chemical engineering has natural candidates: the Gibbs energy of a closed system decreases to equilibrium; for mass-action networks with detailed balance, Σx<sub>i</sub>(ln(x<sub>i</sub>/x<sub>i</sub>*) − 1) + x<sub>i</sub>* is one (Horn and Jackson, 1972)</li>
<li>For an open reactor with heat release no general V exists; that is why multiplicity and oscillation appear</li>
<li>Finding V is an art; when you cannot, simulate from many starts and say so</li></ul></div></div>`});

S.push({kicker:"Part 3 · Limit cycles", title:"When no steady state is stable: sustained oscillations", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
Poincaré–Bendixson (planar systems only): a bounded trajectory that approaches no steady state approaches a closed orbit<br>
So: a trapping region containing only an unstable focus or node ⇒ a limit cycle exists<br>
Bendixson: if div f = tr J has one sign in a simply connected region, no closed orbit lies there</div></div>
<p class="note">Limit cycle: an isolated closed trajectory. Cooled CSTRs, the Belousov–Zhabotinsky reaction and CO oxidation on platinum all show them.</p></div>
<div class="col"><ul class="b xs"><li>For the CSTR with stronger cooling interaction (B = 14, β = 2 in Session 5), the hot steady state becomes an unstable focus, and the reactor oscillates in temperature and conversion</li>
<li>The trace of J changes sign there: Bendixson’s test no longer rules out an orbit</li>
<li>Above two dimensions, chaos is possible (three or more interacting variables), and Poincaré–Bendixson no longer applies</li>
<li>Session 5 finds where oscillations start: the Hopf point, where tr J = 0 and det J &gt; 0</li></ul></div></div>`});

S.push({kicker:"Part 3 · Reporting", title:"What to report about the stability of a steady state", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:18px">

<tr><td>The steady-state residual |f(x*)|</td><td>An eigenvalue of J at a point that is not a steady state means nothing</td></tr>
<tr><td>All eigenvalues of J, with how J was computed (analytic or finite difference)</td><td>Stability, time constants and oscillation frequency in one list</td></tr>

S.push({kicker:"Check 3 · 5 minutes", title:"Check 3: beyond linearization", html:()=>CHECK(3,`${OL}
<li>J has eigenvalues 0 and −2. What can you conclude about stability?</li>
<li>For dx/dt = −x³, show that x* = 0 is asymptotically stable with V = x².</li>
<li>A planar model has one steady state, an unstable focus, inside a trapping box. What does Poincaré–Bendixson say?</li>
<li>Why is one Newton solve not enough to report the steady states of a reactor model?</li></ol>`,
`<li>1. Nothing from linearization; the zero eigenvalue needs higher-order terms, a Lyapunov function or simulation</li>
<li>2. dV/dt = 2x·(−x³) = −2x⁴ &lt; 0 for x ≠ 0, with V &gt; 0: asymptotically stable (J = 0 at x* says nothing)</li>
<li>3. A trajectory in the box approaches a closed orbit: a limit cycle exists</li>
<li>4. Newton finds one root near its start. There may be three or more; search a range or use continuation</li>`),
draw:()=>reveal("k3btn","k3ans")});

S.push({kicker:"Check 4 · 5 minutes", title:"Check 4: the cooled CSTR", html:()=>CHECK(4,`${OL}

 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};
 au.addEventListener("play",setPlayUI);au.addEventListener("pause",setPlayUI);
 au.addEventListener("timeupdate",()=>{tm.textContent=`${fmtT(au.currentTime)} / ${fmtT((S_(slideIdx)||{}).duration)}`;showCap(au.currentTime)});
 au.addEventListener("ended",()=>{setPlayUI();const s=S_(slideIdx);msg.textContent=s&&s.hold?"Activity: do it now, then press Next ›":cur<N-1?"Press Next › or → for the next slide":"End of the session"});
 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
