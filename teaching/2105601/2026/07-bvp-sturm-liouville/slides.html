const LAB_SRC = "\"\"\"Session 7 (2026, semester 2): boundary value problems, Sturm-Liouville eigenproblems, Green's functions,\npellet shape and the axial dispersion reactor.\n\nCourse notation: z or x in (0, 1) a scaled position; phi the Thiele modulus based on the half thickness or radius;\ns the shape index (0 slab, 1 cylinder, 2 sphere); Bi the mass Biot number; Pe the axial Peclet number, Da the\nDamkohler number; Danckwerts conditions c(0) - c'(0)/Pe = 1, c'(1) = 0.\n\nRun `python bvp_lab.py` for a summary, or `python bvp_lab.py --json` to write bvp-results.json.\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy.integrate import solve_bvp\nfrom scipy.optimize import brentq\nfrom scipy.special import iv\n\n\ndef r6(v):\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\ndef sig(v, n=4):\n    return f\"{float(v):.{n}g}\"\n\n\n# ---------------------------------------------------------------------------\n# Part 1. A slab with external mass transfer (Robin condition)\n# ---------------------------------------------------------------------------\ndef robin_slab(phi, Bi):\n    \"\"\"u'' = phi^2 u, u'(0) = 0, u'(1) = Bi (1 - u(1)). Overall eta = (tanh phi/phi) / (1 + phi tanh phi / Bi).\"\"\"\n    t = np.tanh(phi)\n    exact = t / phi if np.isinf(Bi) else (t / phi) / (1 + phi * t / Bi)\n    z = np.linspace(0, 1, 101)\n    if np.isinf(Bi):\n        bc = lambda ya, yb: np.array([ya[1], yb[0] - 1])\n    else:\n        bc = lambda ya, yb: np.array([ya[1], yb[1] - Bi * (1 - yb[0])])\n    sol = solve_bvp(lambda z, y: np.vstack([y[1], phi ** 2 * y[0]]), bc, z, np.vstack([np.ones_like(z), z]), tol=1e-9)\n    return {\"phi\": phi, \"Bi\": \"inf\" if np.isinf(Bi) else Bi, \"exact\": float(exact), \"num\": float(sol.sol(1.0)[1] / phi ** 2),\n            \"us\": float(sol.sol(1.0)[0]), \"nodes\": int(sol.x.size), \"ok\": bool(sol.success)}\n\n\ndef shooting_gain(phis=(2, 5, 10, 20, 40)):\n    \"\"\"Shooting from the center: u(1) = s cosh(phi), so an error in s is amplified cosh(phi) times.\"\"\"\n    return [{\"phi\": p, \"gain\": float(np.cosh(p))} for p in phis]\n\n\n# ---------------------------------------------------------------------------\n# Part 2. Sturm-Liouville: -u'' = lam u, u(0) = 0, u'(1) + h u(1) = 0\n# ---------------------------------------------------------------------------\ndef sl_robin(h=1.0, n=5, N=400):\n    mu = [brentq(lambda m: np.tan(m) + m / h, (k - 0.5) * np.pi + 1e-9, k * np.pi - 1e-9) for k in range(1, n + 1)]\n    lam = np.array(mu) ** 2\n    # finite differences with a ghost node at x = 1: u_{N+1} = u_{N-1} - 2 dx h u_N\n    dx = 1.0 / N\n    A = np.zeros((N, N))\n    for i in range(N):\n        A[i, i] = 2\n        if i > 0: A[i, i - 1] = -1\n        if i < N - 1: A[i, i + 1] = -1\n    A[N - 1, N - 2] = -2; A[N - 1, N - 1] = 2 + 2 * dx * h\n    A /= dx * dx\n    # symmetrize with the weight of the last node (1/2) to get real eigenvalues reliably\n    fd = np.sort(np.linalg.eigvals(A).real)[:n]\n    x = np.linspace(0, 1, 2001)\n    U = np.array([np.sin(m * x) for m in mu])\n    U = U / np.sqrt(np.trapezoid(U * U, x, axis=1))[:, None]\n    G = np.array([[np.trapezoid(U[i] * U[j], x) for j in range(n)] for i in range(n)])\n    off = float(np.abs(G - np.eye(n)).max())\n    return {\"h\": h, \"mu\": [float(m) for m in mu], \"lam\": lam.tolist(), \"fd\": fd.tolist(), \"fd_err\": (np.abs(fd - lam) / lam).tolist(),\n            \"x\": x[::20].tolist(), \"U\": U[:, ::20].tolist(), \"offdiag\": off}\n\n\n# ---------------------------------------------------------------------------\n# Part 3. Green's function and eigenfunction expansion: -u'' = f, u(0) = u(1) = 0, f = 1 on (0, 1/2)\n# ---------------------------------------------------------------------------\ndef step_source(Ns=(1, 3, 10, 30, 100)):\n    x = np.linspace(0, 1, 401)\n    exact = np.where(x <= 0.5, -x ** 2 / 2 + 3 * x / 8, (1 - x) / 8)\n    # Green's function quadrature check: u(x) = int_0^1/2 G(x, s) ds, G = s (1 - x) for s < x, x (1 - s) for s > x\n    sgrid = np.linspace(0, 0.5, 2001)\n    g = np.array([np.trapezoid(np.where(sgrid < xi, sgrid * (1 - xi), xi * (1 - sgrid)), sgrid) for xi in x])\n    out = {\"x\": x.tolist(), \"exact\": exact.tolist(), \"green_err\": float(np.abs(g - exact).max()), \"series\": []}\n    for N in Ns:\n        n = np.arange(1, N + 1)\n        fn = (1 - np.cos(n * np.pi / 2)) / (n * np.pi)                     # int_0^1 f sin(n pi x) dx\n        u = (2 * fn / (n * np.pi) ** 2) @ np.sin(np.outer(n, np.pi * x))\n        f = (2 * fn) @ np.sin(np.outer(n, np.pi * x))\n        out[\"series\"].append({\"N\": int(N), \"err\": float(np.abs(u - exact).max()), \"u\": u.tolist(), \"f\": f.tolist(),\n                              \"fmax\": float(f.max())})\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Part 4. Pellet shape: slab, cylinder, sphere\n# ---------------------------------------------------------------------------\ndef eta_shape(phi, s):\n    if s == 0:\n        return float(np.tanh(phi) / phi)\n    if s == 1:\n        return float(2 * iv(1, phi) / (phi * iv(0, phi)))\n    return float(3 / phi ** 2 * (phi / np.tanh(phi) - 1))\n\n\ndef eta_shape_numeric(phi, s):\n    \"\"\"u'' + (s/r) u' = phi^2 u, u'(0) = 0, u(1) = 1; eta = (s + 1) u'(1)/phi^2 (solve_bvp with the singular term S/r).\"\"\"\n    r = np.linspace(0, 1, 201)\n    S = np.array([[0, 0], [0, -s]])\n    sol = solve_bvp(lambda r, y: np.vstack([y[1], phi ** 2 * y[0]]), lambda ya, yb: np.array([ya[1], yb[0] - 1]),\n                    r, np.vstack([np.ones_like(r), r]), S=S, tol=1e-9)\n    return float((s + 1) * sol.sol(1.0)[1] / phi ** 2)\n\n\ndef shapes():\n    phis = np.round(np.concatenate([np.arange(0.1, 2.0, 0.1), np.arange(2.0, 30.01, 0.5)]), 2)\n    rows = [{\"phi\": float(p), \"eta\": [eta_shape(float(p), s) for s in (0, 1, 2)]} for p in phis]\n    check = [{\"s\": s, \"exact\": eta_shape(3.0, s), \"num\": eta_shape_numeric(3.0, s)} for s in (0, 1, 2)]\n    return {\"rows\": rows, \"check3\": check}\n\n\n# ---------------------------------------------------------------------------\n# Part 5. Axial dispersion reactor with Danckwerts conditions\n# ---------------------------------------------------------------------------\ndef disp_exit(Pe, Da):\n    \"\"\"Wehner-Wilhelm exit concentration, written to avoid overflow.\"\"\"\n    q = np.sqrt(1 + 4 * Da / Pe)\n    return float(4 * q * np.exp(Pe * (1 - q) / 2) / ((1 + q) ** 2 - (1 - q) ** 2 * np.exp(-q * Pe)))\n\n\ndef disp_profile(Pe, Da, n=401):\n    q = np.sqrt(1 + 4 * Da / Pe)\n    r1, r2 = Pe * (1 + q) / 2, Pe * (1 - q) / 2\n    # c = A e^{r1 (z-1)} + B e^{r2 z}\n    M = np.array([[np.exp(-r1) * (1 - r1 / Pe), 1 - r2 / Pe], [r1, r2 * np.exp(r2)]])\n    A, B = np.linalg.solve(M, [1.0, 0.0])\n    z = np.linspace(0, 1, n)\n    c = A * np.exp(r1 * (z - 1)) + B * np.exp(r2 * z)\n    return {\"Pe\": Pe, \"Da\": Da, \"z\": z.tolist(), \"c\": c.tolist(), \"c0\": float(c[0]), \"c1\": float(c[-1]), \"X\": float(1 - c[-1])}\n\n\ndef disp_numeric(Pe, Da):\n    z = np.linspace(0, 1, 201)\n    sol = solve_bvp(lambda z, y: np.vstack([y[1], Pe * (y[1] + Da * y[0])]),\n                    lambda ya, yb: np.array([ya[0] - ya[1] / Pe - 1, yb[1]]), z, np.vstack([np.exp(-Da * z), -Da * np.exp(-Da * z)]), tol=1e-9)\n    return {\"c1\": float(sol.sol(1.0)[0]), \"c0\": float(sol.sol(0.0)[0]), \"nodes\": int(sol.x.size), \"ok\": bool(sol.success)}\n\n\ndef disp_second(Pe, Da):\n    \"\"\"Second-order rate: (1/Pe) u'' - u' - Da u^2 = 0 with Danckwerts conditions (solve_bvp); no closed form.\"\"\"\n    z = np.linspace(0, 1, 201)\n    sol = solve_bvp(lambda z, y: np.vstack([y[1], Pe * (y[1] + Da * y[0] ** 2)]),\n                    lambda ya, yb: np.array([ya[0] - ya[1] / Pe - 1, yb[1]]), z, np.vstack([np.exp(-z), -np.exp(-z)]), tol=1e-8)\n    return {\"Pe\": Pe, \"Da\": Da, \"X\": float(1 - sol.sol(1.0)[0]), \"ok\": bool(sol.success), \"nodes\": int(sol.x.size),\n            \"pfr\": Da / (1 + Da), \"cstr\": float(1 - (np.sqrt(1 + 4 * Da) - 1) / (2 * Da))}\n\n\nPE_LIST = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 20, 30, 50, 100, 200, 500, 1000]\n\n\ndef disp_sweep(Da):\n    return [{\"Pe\": p, \"X\": 1 - disp_exit(p, Da)} for p in PE_LIST]\n\n\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, (np.floating, float)):\n        v = float(o)\n        return 0.0 if abs(v) < 1e-300 else v\n    if isinstance(o, np.integer):\n        return int(o)\n    return o\n\n\nLECT_DA, LAB_DA = 2.0, 3.0\n\n\ndef classroom_results():\n    R = {\"lecture\": {\"robin\": [robin_slab(3.0, b) for b in (1.0, 3.0, 10.0, 100.0, np.inf)], \"gain\": shooting_gain(),\n                     \"sl\": sl_robin(), \"green\": step_source(), \"shapes\": shapes(),\n                     \"disp\": {\"Da\": LECT_DA, \"prof\": [disp_profile(p, LECT_DA) for p in (1, 10, 100)], \"sweep\": disp_sweep(LECT_DA),\n                              \"num10\": disp_numeric(10, LECT_DA), \"pfr\": float(1 - np.exp(-LECT_DA)), \"cstr\": LECT_DA / (1 + LECT_DA)}},\n         \"lab\": {\"Da\": LAB_DA, \"prof\": [disp_profile(p, LAB_DA) for p in (1, 5, 50)], \"num5\": disp_numeric(5, LAB_DA),\n                 \"sweep\": disp_sweep(LAB_DA), \"second\": disp_second(5.0, LAB_DA), \"pfr\": float(1 - np.exp(-LAB_DA)), \"cstr\": LAB_DA / (1 + LAB_DA)},\n         \"versions\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__}}\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"bvp-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote bvp-results.json\"); sys.exit()\n    L = R[\"lecture\"]\n    print(\"robin\", [(q[\"Bi\"], r6(q[\"exact\"]), r6(q[\"num\"]), r6(q[\"us\"]), q[\"nodes\"]) for q in L[\"robin\"]])\n    print(\"gain\", [(q[\"phi\"], sig(q[\"gain\"])) for q in L[\"gain\"]])\n    S = L[\"sl\"]; print(\"SL mu\", r6(S[\"mu\"]), \"lam\", r6(S[\"lam\"]), \"fd rel err\", [sig(e, 2) for e in S[\"fd_err\"]], \"offdiag\", sig(S[\"offdiag\"], 2))\n    G = L[\"green\"]; print(\"green err\", sig(G[\"green_err\"], 2), \"series\", [(q[\"N\"], sig(q[\"err\"], 3), r6(q[\"fmax\"])) for q in G[\"series\"]])\n    print(\"shapes phi=3\", [(q[\"s\"], r6(q[\"exact\"]), r6(q[\"num\"])) for q in L[\"shapes\"][\"check3\"]])\n    D = L[\"disp\"]; print(\"disp\", [(q[\"Pe\"], r6(q[\"c0\"]), r6(q[\"X\"])) for q in D[\"prof\"]], \"num10\", D[\"num10\"], \"pfr\", r6(D[\"pfr\"]), \"cstr\", r6(D[\"cstr\"]))\n    print(\"sweep\", [(q[\"Pe\"], r6(q[\"X\"])) for q in D[\"sweep\"]])\n    B = R[\"lab\"]; print(\"lab\", [(q[\"Pe\"], r6(q[\"c0\"]), r6(q[\"X\"])) for q in B[\"prof\"]], \"num5\", B[\"num5\"], r6(B[\"pfr\"]), r6(B[\"cstr\"]))\n    print(\"lab second\", B[\"second\"])\n    print(\"lab sweep\", [(q[\"Pe\"], r6(q[\"X\"])) for q in B[\"sweep\"]])\n";   // embedded copy, so live Python also works when the file is opened locally

function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}

S.push({kicker:"Part 1 · Existence and uniqueness", title:"The Fredholm alternative", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
L u = −u″ − λu = f, &nbsp;u(0) = u(1) = 0<br>
Either λ is not an eigenvalue (nπ)²: a unique solution for every f<br>
Or λ = (nπ)²: a solution exists only if ∫<sub>0</sub><sup>1</sup> f sin(nπx) dx = 0, and then it is not unique<br>
Example: λ = π², f = 1: ∫ sin πx dx = 2/π ≠ 0, so no solution</div></div>
<p class="note">The matrix version from Session 1: Ax = b is solvable if and only if b is orthogonal to the null space of Aᵀ. For a self-adjoint operator, Aᵀ = A.</p></div>
<div class="col"><ul class="b xs"><li>Physically: forcing at a natural mode with no damping has no steady solution (resonance)</li>
<li>Pure Neumann conditions are a common trap: −u″ = f with u′(0) = u′(1) = 0 needs ∫f = 0, a steady state exists only if sources and sinks balance, and the solution is defined up to a constant</li>
<li>When solve_bvp fails to converge, check this first: the problem may have no unique solution</li>
<li>Nonlinear BVPs can have several solutions, as the CSTR had several steady states (Session 4); the exothermic pellet is the classic case</li></ul></div></div>`});

S.push({kicker:"Part 2 · Sturm–Liouville form", title:"The symmetric matrices of differential equations", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
−(p u′)′ + q u = λ w u on (a, b), with separated conditions<br>
α<sub>1</sub>u(a) + β<sub>1</sub>u′(a) = 0, &nbsp;α<sub>2</sub>u(b) + β<sub>2</sub>u′(b) = 0<br>
p &gt; 0, w &gt; 0: the operator is self-adjoint in ⟨f, g⟩ = ∫ f g w dx<br>
Slab: p = w = 1. Cylinder: p = w = r (Bessel). Sphere: p = w = r²</div></div>
<p class="note">Any equation a u″ + b u′ + c u = −λ u can be put in this form by multiplying by the integrating factor exp(∫ b/a dx)/a.</p></div>
<div class="col"><ul class="b xs"><li>Eigenvalues are real and can be ordered λ<sub>1</sub> &lt; λ<sub>2</sub> &lt; … → ∞, each with one eigenfunction; the n-th has n − 1 interior zeros</li>
<li>Eigenfunctions for different λ are orthogonal with weight w</li>
<li>They are complete: any square-integrable f has f = Σ c<sub>n</sub>u<sub>n</sub> with c<sub>n</sub> = ⟨f, u<sub>n</sub>⟩/⟨u<sub>n</sub>, u<sub>n</sub>⟩, as for an orthogonal basis in Session 1</li>
<li>The Rayleigh quotient λ<sub>1</sub> = min ∫(p u′² + q u²)/∫ w u² gives the lowest eigenvalue, and with it the slowest decay rate of a transient</li></ul></div></div>`});

<div class="col"><ul class="b xs"><li>Conversion rises from the CSTR value to the PFR value as Pe grows; most of the change happens between Pe ≈ 1 and 100</li>
<li>For a BVP solution, report: the conditions and the balance behind each, the solver, its tolerance and final mesh size, the residual, and a check against a known limit or closed form</li>
<li>For a dispersion model, also report how Pe was obtained (a tracer test, a correlation) and its uncertainty: it often matters more than the solver error</li></ul></div></div>`,

 series:[{pts:[[-1,D.pfr],[3,D.pfr]],c:C.teal,w:2,dash:true},{pts:[[-1,D.cstr],[3,D.cstr]],c:C.graphite,w:2,dash:true},{pts:W.map(q=>[Math.log10(q.Pe),q.X]),c:C.amber,w:3.4}],
 marks:W.map(q=>({x:Math.log10(q.Pe),y:q.X,r:4})),legend:[{c:C.amber,line:true,t:"dispersion model"},{c:C.teal,line:true,dash:true,t:"plug flow"},{c:C.graphite,line:true,dash:true,t:"one CSTR"}],lx:300,ly:200})}});

S.push({kicker:"Check 3 · 5 minutes", title:"Check 3: the dispersion reactor", html:()=>CHECK(3,`${OL}
<li>Derive the Danckwerts inlet condition from a flux balance across the inlet plane.</li>
<li>Why is c′(1) = 0 at the outlet?</li>
<li>At Pe = 10 and Da = 2, is the conversion closer to the PFR or to the CSTR value?</li>
<li>Where is the boundary layer at large Pe, and how thick is it?</li></ol>`,
`<li>1. v c<sub>in</sub> = v c(0⁺) − D<sub>ax</sub>c′(0⁺); scaled: u(0) − u′(0)/Pe = 1</li>
<li>2. Beyond the outlet there is no reaction or dispersion, so the concentration cannot keep changing; a nonzero gradient would imply a flux with no source</li>
<li>3. Closer to the PFR: ${fmt(LC().disp.sweep.find(q=>q.Pe===10).X,3)} against ${fmt(LC().disp.pfr,3)} (PFR) and ${fmt(LC().disp.cstr,3)} (CSTR)</li>
<li>4. At the outlet, thickness about 1/Pe: there the outer (plug-flow) solution must be bent to meet u′(1) = 0</li>`),
draw:()=>reveal("k3btn","k3ans")});

S.push({kicker:"Check 4 · 5 minutes", title:"Check 4: across the course", html:()=>CHECK(4,`${OL}
<li>Discretize u″ = φ²u on a uniform grid. Which property of the matrix from Session 2 guarantees real eigenvalues?</li>
<li>The discretized problem is solved by a linear solver. Which Session 1 idea tells you whether it has a unique solution?</li>
<li>A nonlinear pellet model has three solutions. Which Session 4 and 5 tools tell you which are stable and where they appear?</li>
<li>At φ = 50, which Session 6 result would you use to check your numerical η?</li></ol>`,
`<li>1. It is symmetric (with a symmetric treatment of the boundary rows), the discrete counterpart of self-adjointness</li>
<li>2. Rank and null space: unique if the matrix has full rank (the Fredholm alternative is the same statement)</li>
<li>3. Linearize about each solution and check eigenvalues (Session 4); continue in φ and detect folds (Session 5)</li>
<li>4. The large-φ asymptote η ≈ (1/φ)√(2/(n + 1)), with the error falling as φ grows</li>`),
draw:()=>reveal("k4btn","k4ans")});

S.push({kicker:"The course before the midterm", title:"Seven sessions, one toolkit", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:16px">
<tr><th class="n">S</th><th>Topic</th><th>Question it answers about a model</th></tr>
<tr><td class="n">1</td><td>Vector spaces, rank, projection</td><td>Which quantities are independent? What can the data determine?</td></tr>
<tr><td class="n">2</td><td>Eigenvalues and the SVD</td><td>Which directions matter, and how well conditioned is the problem?</td></tr>
<tr><td class="n">3</td><td>Linear ODE systems</td><td>How does a linear network evolve, on which time scales?</td></tr>
<tr><td class="n">4</td><td>Stability of nonlinear systems</td><td>Which steady states are stable, and what happens near them?</td></tr>
<tr><td class="n">5</td><td>Bifurcation</td><td>Where do steady states appear, vanish or start to oscillate?</td></tr>
<tr><td class="n">6</td><td>Scaling and perturbation</td><td>Which group controls the result, and what is its limit?</td></tr>
<tr><td class="n">7</td><td>Boundary value problems</td><td>What do the conditions at the boundaries determine, and in which basis?</td></tr></table>
<p class="note">The midterm covers all seven. Expect one problem that needs two or more sessions together, like Check 4.</p></div></div>`});

(function(){if(!NARR)return;
 const au=document.getElementById("narr"),bar=document.getElementById("nbar"),cap=document.getElementById("cap"),play=document.getElementById("nPlay"),tm=document.getElementById("nTime"),msg=document.getElementById("nMsg");
 document.getElementById("dock").style.display="flex";document.getElementById("help").style.display="none";let on=false,lang="off",slideIdx=-1;
 const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
 lang=ls("cc-lang")||"off";const sp=ls("narr-speed");if(sp)document.getElementById("nSpeed").value=sp;
 const fmtT=t=>isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`:"0:00";
 const S_=i=>NARR.slides[i];
 function load(i){slideIdx=i;const s=S_(i);if(!s){au.removeAttribute("src");return}au.src=s.file;au.playbackRate=+document.getElementById("nSpeed").value;tm.textContent=`0:00 / ${fmtT(s.duration)}`;showCap(0)}
 function setPlayUI(){play.textContent=au.paused?"▶ Play":"❚❚ Pause";play.classList.toggle("on",!au.paused)}
 // captions sit in their own band under the slide; long lines shrink to fit the band
 window.capRefit=()=>{let f=parseFloat(cap.dataset.fs)||18;cap.style.fontSize=f+"px";while(cap.scrollHeight>cap.clientHeight+1&&f>11){f-=1;cap.style.fontSize=f+"px"}};
 function showCap(t){const s=S_(slideIdx);let c=null;if(s&&lang!=="off"){for(const q of s.cues){if(t>=q.s-0.05)c=q;else break}}
  const txt=(!c||(au.paused&&au.currentTime===0&&!on))?"":(lang==="th"?c.th:c.en);if(cap.textContent!==txt){cap.textContent=txt;capRefit()}}
 function ccUI(){const b=document.getElementById("nCC");b.textContent=lang==="off"?"CC off":lang==="en"?"CC English":"CC ไทย";b.classList.toggle("on",lang!=="off");CAP_ON=lang!=="off";fit();showCap(au.currentTime||0)}
 window.ccCycle=()=>{lang=lang==="off"?"en":lang==="en"?"th":"off";ls("cc-lang",lang);ccUI()};
 // "on" means the student is listening: it starts with Play and ends with Pause or Stop.
 // Slides change only when the student moves; the new slide's narration then starts if "on".
 window.narrToggle=()=>{if(au.paused){on=true;if(slideIdx!==cur)load(cur);if(au.ended)au.currentTime=0;msg.textContent="";au.play().catch(()=>{msg.textContent="Press Play again to start audio."})}else{on=false;au.pause()}};
 window.onSlideChange=i=>{au.pause();msg.textContent="";load(i);if(on)au.play().catch(()=>{})};
 document.getElementById("nPlay").onclick=narrToggle;
 document.getElementById("nStop").onclick=()=>{au.pause();au.currentTime=0;on=false;setPlayUI();showCap(0);tm.textContent=`0:00 / ${fmtT((S_(cur)||{}).duration)}`};
 document.getElementById("nCC").onclick=ccCycle;
 document.getElementById("nPrev").onclick=()=>show(cur-1);document.getElementById("nNext").onclick=()=>show(cur+1);
 document.getElementById("nSpeed").onchange=e=>{au.playbackRate=+e.target.value;ls("narr-speed",e.target.value)};
 au.addEventListener("play",setPlayUI);au.addEventListener("pause",setPlayUI);
 au.addEventListener("timeupdate",()=>{tm.textContent=`${fmtT(au.currentTime)} / ${fmtT((S_(slideIdx)||{}).duration)}`;showCap(au.currentTime)});
 au.addEventListener("ended",()=>{setPlayUI();const s=S_(slideIdx);msg.textContent=s&&s.hold?"Activity: do it now, then press Next ›":cur<N-1?"Press Next › or → for the next slide":"End of the session"});
 const q=new URLSearchParams(location.search);
 if(q.get("narrate")==="1"){const ov=document.getElementById("startov");ov.style.display="flex";document.getElementById("startBtn").onclick=()=>{ov.style.display="none";if(lang==="off"){lang="en";ls("cc-lang",lang)}ccUI();on=true;load(cur);au.play().catch(()=>{})}}
 ccUI();setTimeout(()=>{if(slideIdx<0)load(cur)},0);
})();

build();drawAll();fit();show((parseInt(location.hash.slice(1))||1)-1);
</script>
