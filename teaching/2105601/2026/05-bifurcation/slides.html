const LAB_SRC = "\"\"\"Session 5 (2026, semester 2): bifurcation and multiplicity, by continuation.\n\nModel: the dimensionless cooled CSTR of Session 4 (Uppal, Ray and Poore, 1974, large activation energy):\n    f1 = -x1 + Da (1 - x1) exp(x2),  f2 = -x2 + B Da (1 - x1) exp(x2) - beta x2.\nSteady states satisfy x1 = (1 + beta) x2 / B, so Da(x2) = x1 exp(-x2) / (1 - x1) gives the whole S-curve in closed form;\nthe pseudo-arclength continuation below finds the same curve without that shortcut, as it would for a model without one.\nFolds (turning points): det J = 0. Hopf points: tr J = 0 with det J > 0. Multiplicity requires B > 4 (1 + beta).\n\nRun `python bifurcation_lab.py` for a summary, or `python bifurcation_lab.py --json` to write bifurcation-results.json.\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy.integrate import solve_ivp\nfrom scipy.optimize import brentq\n\n\ndef r6(v):\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\ndef sig(v, n=4):\n    return f\"{float(v):.{n}g}\"\n\n\ndef f(x, Da, B, beta):\n    r = Da * (1 - x[0]) * np.exp(x[1])\n    return np.array([-x[0] + r, -x[1] + B * r - beta * x[1]])\n\n\ndef jac(x, Da, B, beta):\n    e = np.exp(x[1])\n    return np.array([[-1 - Da * e, Da * (1 - x[0]) * e], [-B * Da * e, -1 - beta + B * Da * (1 - x[0]) * e]])\n\n\ndef dfdDa(x, Da, B, beta):\n    r = (1 - x[0]) * np.exp(x[1])\n    return np.array([r, B * r])\n\n\n# ---------------------------------------------------------------------------\n# Closed-form S-curve and its special points\n# ---------------------------------------------------------------------------\ndef scurve(B, beta, n=400):\n    c = (1 + beta) / B\n    x2 = np.linspace(1e-3, 1 / c - 1e-3, n); x1 = c * x2\n    Da = x1 * np.exp(-x2) / (1 - x1)\n    tr, det = [], []\n    for a, b, d in zip(x1, x2, Da):\n        J = jac([a, b], d, B, beta); tr.append(np.trace(J)); det.append(np.linalg.det(J))\n    return {\"x2\": x2.tolist(), \"x1\": x1.tolist(), \"Da\": Da.tolist(), \"tr\": tr, \"det\": det}\n\n\ndef special_points(B, beta):\n    \"\"\"Folds from c x2^2 - x2 + 1 = 0 (c = (1 + beta)/B); Hopf from tr J = 0 with det J > 0 on the curve.\"\"\"\n    c = (1 + beta) / B\n    out = {\"cusp_B\": 4 * (1 + beta), \"folds\": [], \"hopf\": []}\n    disc = 1 - 4 * c\n    if disc > 0:\n        for x2 in sorted(((1 - np.sqrt(disc)) / (2 * c), (1 + np.sqrt(disc)) / (2 * c))):\n            x1 = c * x2; Da = x1 * np.exp(-x2) / (1 - x1)\n            out[\"folds\"].append({\"x2\": float(x2), \"x1\": float(x1), \"Da\": float(Da), \"det\": float(np.linalg.det(jac([x1, x2], Da, B, beta)))})\n    def trace_at(x2):\n        x1 = c * x2; Da = x1 * np.exp(-x2) / (1 - x1); return np.trace(jac([x1, x2], Da, B, beta))\n    xs = np.linspace(1e-3, 1 / c - 1e-3, 4001); tv = [trace_at(x) for x in xs]\n    for i in range(len(xs) - 1):\n        if tv[i] * tv[i + 1] < 0:\n            x2 = brentq(trace_at, xs[i], xs[i + 1], xtol=1e-13); x1 = c * x2; Da = x1 * np.exp(-x2) / (1 - x1)\n            d = np.linalg.det(jac([x1, x2], Da, B, beta))\n            if d > 0:\n                out[\"hopf\"].append({\"x2\": float(x2), \"x1\": float(x1), \"Da\": float(Da), \"omega\": float(np.sqrt(d)), \"period\": float(2 * np.pi / np.sqrt(d))})\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Pseudo-arclength continuation in (x1, x2, Da)\n# ---------------------------------------------------------------------------\ndef continuation(B, beta, Da0=0.01, ds=0.02, nmax=4000, Da_max=0.3):\n    \"\"\"Follow the steady-state branch from the cold state at Da0 through both folds (Keller's method).\"\"\"\n    c = (1 + beta) / B\n    g = lambda x1: x1 - Da0 * (1 - x1) * np.exp(x1 / c)\n    x1 = brentq(g, 0, 0.5); y = np.array([x1, x1 / c, Da0])\n    F = lambda y: f(y[:2], y[2], B, beta)\n    def Fy(y):\n        return np.column_stack([jac(y[:2], y[2], B, beta), dfdDa(y[:2], y[2], B, beta)])\n    t = np.array([0.0, 0.0, 1.0]); A = Fy(y)\n    t = np.linalg.svd(A)[2][-1]; t = t if t[2] > 0 else -t\n    pts, steps, newton_its = [y.copy()], 0, []\n    while steps < nmax and y[2] < Da_max and y[0] < 0.995:\n        yp = y + ds * t; z = yp.copy()\n        for it in range(20):\n            G = np.concatenate([F(z), [t @ (z - y) - ds]])\n            M = np.vstack([Fy(z), t])\n            dz = np.linalg.solve(M, -G); z = z + dz\n            if np.abs(dz).max() < 1e-12:\n                break\n        newton_its.append(it + 1)\n        tn = np.linalg.svd(Fy(z))[2][-1]; tn = tn if tn @ t > 0 else -tn\n        y, t = z, tn; pts.append(y.copy()); steps += 1\n    P = np.array(pts)\n    dets = [float(np.linalg.det(jac(p[:2], p[2], B, beta))) for p in P]\n    trs = [float(np.trace(jac(p[:2], p[2], B, beta))) for p in P]\n    # check against the closed form Da(x2)\n    err = float(np.max(np.abs(P[:, 2] - (c * P[:, 1]) * np.exp(-P[:, 1]) / (1 - c * P[:, 1]))))\n    fold_idx = [i for i in range(len(dets) - 1) if dets[i] * dets[i + 1] < 0]\n    hopf_idx = [i for i in range(len(trs) - 1) if trs[i] * trs[i + 1] < 0 and dets[i] > 0]\n    keep = slice(None, None, max(1, len(P) // 400))\n    return {\"Da\": P[keep, 2].tolist(), \"x1\": P[keep, 0].tolist(), \"x2\": P[keep, 1].tolist(), \"steps\": steps,\n            \"max_newton\": int(max(newton_its)), \"err_closed_form\": err,\n            \"folds_Da\": [float(P[i, 2]) for i in fold_idx], \"hopf_Da\": [float(P[i, 2]) for i in hopf_idx]}\n\n\n# ---------------------------------------------------------------------------\n# Hysteresis: slow ramp of Da up and down, by simulation\n# ---------------------------------------------------------------------------\ndef hysteresis(B, beta, Da_lo=0.02, Da_hi=0.09, n=57, hold=40.0):\n    up, down = [], []\n    x = np.array([0.0, 0.0])\n    grid = np.linspace(Da_lo, Da_hi, n)\n    for Da in grid:\n        x = solve_ivp(lambda t, z: f(z, Da, B, beta), (0, hold), x, rtol=1e-9, atol=1e-11, method=\"LSODA\").y[:, -1]\n        up.append(float(x[1]))\n    for Da in grid[::-1]:\n        x = solve_ivp(lambda t, z: f(z, Da, B, beta), (0, hold), x, rtol=1e-9, atol=1e-11, method=\"LSODA\").y[:, -1]\n        down.append(float(x[1]))\n    return {\"Da\": grid.tolist(), \"up\": up, \"down\": down[::-1]}\n\n\n# ---------------------------------------------------------------------------\n# Limit cycles beyond the Hopf point\n# ---------------------------------------------------------------------------\ndef oscillation(B, beta, Da, tmax=200.0):\n    sol = solve_ivp(lambda t, z: f(z, Da, B, beta), (0, tmax), [0.5, 3.0], rtol=1e-9, atol=1e-11, method=\"LSODA\", dense_output=True)\n    t = np.linspace(tmax - 40, tmax, 801); X = sol.sol(t)\n    x2 = X[1]\n    pk = [i for i in range(1, len(x2) - 1) if x2[i] > x2[i - 1] and x2[i] >= x2[i + 1] and x2[i] > x2.mean()]\n    period = float(np.mean(np.diff(t[pk]))) if len(pk) > 1 else None\n    amp = float(x2.max() - x2.min())\n    return {\"Da\": Da, \"t\": (t - t[0]).tolist(), \"x1\": X[0].tolist(), \"x2\": x2.tolist(), \"period\": period, \"amp\": amp,\n            \"x2max\": float(x2.max()), \"x2min\": float(x2.min())}\n\n\ndef amplitude_sweep(B, beta, Das):\n    return [{\"Da\": float(d), \"amp\": oscillation(B, beta, float(d))[\"amp\"]} for d in Das]\n\n\ndef beta_sweep(B, betas):\n    out = []\n    for b in betas:\n        sp = special_points(B, b)\n        out.append({\"beta\": float(b), \"folds\": [q[\"Da\"] for q in sp[\"folds\"]], \"hopf\": [q[\"Da\"] for q in sp[\"hopf\"]], \"cusp_B\": sp[\"cusp_B\"]})\n    return out\n\n\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, (np.floating, float)):\n        v = float(o)\n        return 0.0 if abs(v) < 1e-14 else v\n    if isinstance(o, np.integer):\n        return int(o)\n    return o\n\n\nLECT = {\"B\": 8.0, \"beta\": 0.3}\nLAB = {\"B\": 14.0, \"beta\": 2.0}\n\n\ndef classroom_results():\n    Bl, bl = LECT[\"B\"], LECT[\"beta\"]\n    Bk, bk = LAB[\"B\"], LAB[\"beta\"]\n    R = {\"lecture\": {\"P\": LECT, \"s\": scurve(Bl, bl), \"sp\": special_points(Bl, bl), \"cont\": continuation(Bl, bl, Da_max=0.12),\n                     \"hyst\": hysteresis(Bl, bl),\n                     \"cusp\": [{\"beta\": float(b), \"B\": 4 * (1 + b)} for b in np.linspace(0, 3, 31)]},\n         \"lab\": {\"P\": LAB, \"s\": scurve(Bk, bk), \"sp\": special_points(Bk, bk), \"cont\": continuation(Bk, bk, Da_max=0.2),\n                 \"osc\": oscillation(Bk, bk, 0.12), \"amp\": amplitude_sweep(Bk, bk, [0.11, 0.115, 0.12, 0.125, 0.128, 0.13]),\n                 \"beta\": beta_sweep(Bk, np.round(np.arange(1.0, 3.01, 0.1), 2))},\n         \"versions\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__}}\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"bifurcation-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote bifurcation-results.json\"); sys.exit()\n    for k in (\"lecture\", \"lab\"):\n        L = R[k]; sp = L[\"sp\"]\n        print(k, L[\"P\"], \"cusp B\", sp[\"cusp_B\"], \"folds\", [(r6(q[\"Da\"]), r6(q[\"x2\"])) for q in sp[\"folds\"]], \"hopf\", [(r6(q[\"Da\"]), r6(q[\"x2\"]), r6(q[\"period\"])) for q in sp[\"hopf\"]])\n        c = L[\"cont\"]; print(\"  continuation steps\", c[\"steps\"], \"max newton\", c[\"max_newton\"], \"err\", sig(c[\"err_closed_form\"]), \"folds\", r6(c[\"folds_Da\"]), \"hopf\", r6(c[\"hopf_Da\"]))\n    H = R[\"lecture\"][\"hyst\"]; print(\"hyst jump up at\", [H[\"Da\"][i] for i in range(1, len(H[\"up\"])) if H[\"up\"][i] - H[\"up\"][i-1] > 1][:1], \"down at\", [H[\"Da\"][i] for i in range(len(H[\"down\"]) - 1) if H[\"down\"][i + 1] - H[\"down\"][i] > 1][:1])\n    O = R[\"lab\"][\"osc\"]; print(\"osc Da\", O[\"Da\"], \"period\", r6(O[\"period\"]), \"amp\", r6(O[\"amp\"]), O[\"x2min\"], O[\"x2max\"])\n    print(\"amp\", [(q[\"Da\"], r6(q[\"amp\"])) for q in R[\"lab\"][\"amp\"]])\n    print(\"beta\", [(q[\"beta\"], r6(q[\"folds\"]), r6(q[\"hopf\"])) for q in R[\"lab\"][\"beta\"]][::5])\n";   // embedded copy, so live Python also works when the file is opened locally

function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}

  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}

function contours(f,xr,yr,nx,ny,levels,px,py,stroke,sw,op){let s="";const xs=[],ys=[];
 for(let i=0;i<=nx;i++)xs.push(xr[0]+(xr[1]-xr[0])*i/nx);for(let j=0;j<=ny;j++)ys.push(yr[0]+(yr[1]-yr[0])*j/ny);
 const F=ys.map(y=>xs.map(x=>f(x,y)));
 levels.forEach(c=>{let d="";for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const v=[F[j][i],F[j][i+1],F[j+1][i+1],F[j+1][i]],

  for(let k=0;k<4;k++){const a=v[k],b=v[(k+1)%4];if((a<c)!==(b<c)){const q=(c-a)/(b-a),A=P[k],B=P[(k+1)%4];pts.push([A[0]+q*(B[0]-A[0]),A[1]+q*(B[1]-A[1])])}}

function rankOf(M){if(!M.length)return 0;const A=M.map(r=>r.slice());const m=A.length,n=A[0].length;let r=0;
 for(let c=0;c<n&&r<m;c++){let p=r;for(let i=r+1;i<m;i++)if(Math.abs(A[i][c])>Math.abs(A[p][c]))p=i;if(Math.abs(A[p][c])<1e-9)continue;
  [A[r],A[p]]=[A[p],A[r]];for(let i=0;i<m;i++)if(i!==r){const f=A[i][c]/A[r][c];for(let j=c;j<n;j++)A[i][j]-=f*A[r][j]}r++}return r}
/* a matrix as an HTML table with row and column labels */
function mat(M,rows,cols,o={}){let s=`<table class="t" style="font-size:${o.fs||17}px;width:auto"><tr><th></th>${cols.map(c=>`<th class="n">${c}</th>`).join("")}</tr>`;

J dx*/dp + ∂f/∂p = 0 ⇒ dx*/dp = −J⁻¹ ∂f/∂p<br>

S.push({kicker:"Part 2 · Detecting bifurcations", title:"Test functions: watch det J and tr J along the branch", html:()=>`<div class="body"><div class="col w55"><div class="panel grow"><div class="chart" id="ch-tf"></div></div></div>
<div class="col"><ul class="b xs"><li>Along the branch, compute test functions that change sign at a bifurcation: det J for folds, tr J (in 2D; in general the real part of the leading complex pair) for Hopf points</li>
<li>A sign change between two steps brackets the point; a few secant or Newton steps on the augmented system locate it accurately</li>
<li>Here det J (amber) crosses zero twice, at the two folds; tr J (teal) crosses zero twice: once on the saddle branch, where det J &lt; 0 (no Hopf), and once near the upper fold, where det J &gt; 0: a Hopf point at Da ≈ ${fmt(SPL().hopf[0].Da,4)}</li>
<li>For the lecture reactor the Hopf point and the extinction fold almost coincide, so the oscillating range is tiny. With stronger cooling interaction (Lab 5) they separate</li></ul></div></div>`,
draw:()=>{const s=LC().s,n=s.x2.length;const scale=v=>Math.max(-2,Math.min(2,Math.sign(v)*Math.log10(1+Math.abs(v))));

  series:[{pts:s.x2.map((x,i)=>[x,scale(s.det[i])]),c:C.amber,w:3},{pts:s.x2.map((x,i)=>[x,scale(s.tr[i])]),c:C.teal,w:3}],
  under:(px,py)=>`<line x1="${px(0)}" x2="${px(6.2)}" y1="${py(0)}" y2="${py(0)}" stroke="${C.graphite}" stroke-width="1.2"/>`,legend:[{c:C.amber,line:true,t:"det J"},{c:C.teal,line:true,t:"tr J"}],lx:90,ly:40})}});

S.push({kicker:"Part 2 · The Hopf bifurcation", title:"A complex pair crosses the imaginary axis and a limit cycle is born", html:()=>{const sp=LB().sp,h=sp.hopf[0];return `<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
At the Hopf point: λ = ±iω, &nbsp;ω = √det J (planar case, tr J = 0)<br>
Period of the small oscillation: T ≈ 2π/ω<br>
Transversality: d(Re λ)/dp ≠ 0<br>
Supercritical: a stable cycle grows with amplitude ∝ √|p − p<sub>H</sub>|<br>
Subcritical: an unstable cycle shrinks onto the steady state; the jump is to a far attractor</div></div>
<p class="note">Andronov–Hopf theorem. Which case occurs depends on a cubic coefficient (the first Lyapunov coefficient); compute it, or test by simulation on both sides.</p></div>
<div class="col"><ul class="b xs"><li>Lab 5 reactor (B = ${LB().P.B}, β = ${LB().P.beta}): Hopf at Da = ${fmt(h.Da,4)}, x<sub>2</sub>* = ${fmt(h.x2,3)}, ω = ${fmt(h.omega,3)}, so T ≈ ${fmt(h.period,3)} residence times</li>
<li>For Da just below the Hopf point the only steady state is an unstable focus, and the reactor settles on a limit cycle</li>
<li>Simulated amplitudes of x<sub>2</sub> shrink toward the Hopf point like a square root: the supercritical case</li>
<li>Far from the Hopf point the cycle grows into relaxation oscillations: slow heating, sudden ignition, quench</li></ul></div></div>`}});

S.push({kicker:"Part 2 · Derivation", title:"Derive the Jacobian on the branch and the Hopf condition", html:()=>DERIV([
 ["J = [[−1 − Da e<sup>x₂</sup>, Da(1 − x<sub>1</sub>)e<sup>x₂</sup>], [−B Da e<sup>x₂</sup>, −(1 + β) + B Da(1 − x<sub>1</sub>)e<sup>x₂</sup>]]","Differentiate the right-hand sides"],
 ["On the branch Da(1 − x<sub>1</sub>)e<sup>x₂</sup> = x<sub>1</sub>, Da e<sup>x₂</sup> = x<sub>1</sub>/(1 − x<sub>1</sub>)","Use the steady state to remove Da"],
 ["tr J = −1/(1 − x<sub>1</sub>) − (1 + β) + Bx<sub>1</sub>","Diagonal entries"],
 ["det J = [(1 + β) − Bx<sub>1</sub>(1 − x<sub>1</sub>)]/(1 − x<sub>1</sub>)","Product minus cross terms"],
 ["λ = ½[tr J ± √(tr² J − 4 det J)]: tr J = 0, det J &gt; 0 ⇒ λ = ±iω, ω = √det J","A complex pair on the imaginary axis"],
 ["Hopf: tr J changes sign along the branch with det J &gt; 0 (transversal crossing)","Small cycles start with period 2π/ω"]],
 "Both test functions are now explicit in x<sub>1</sub>: the folds solve det J = 0 and the Hopf points solve tr J = 0. That is how the module refines them after continuation brackets them.")});

 ["z = re<sup>iθ</sup>: ṙ = μr − Re(a) r³, &nbsp;θ̇ = ω − Im(a) r²","Polar coordinates"],
