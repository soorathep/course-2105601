const LAB_SRC = "\"\"\"Session 6 (2026, semester 2): scaling, regular and singular perturbation, boundary layers.\n\nCourse notation: epsilon a small dimensionless parameter; outer solution y_o, inner solution y_i in the stretched\nvariable X = x/epsilon (or x/delta); composite y_c = y_o + y_i - (common limit). Thiele modulus phi for a catalyst slab:\nd2c/dz2 = phi^2 r(c), c'(0) = 0, c(1) = 1; effectiveness factor eta = (1/phi^2) c'(1).\n\nRun `python perturb_lab.py` for a summary, or `python perturb_lab.py --json` to write perturb-results.json.\n\"\"\"\nimport json\nimport sys\n\nimport numpy as np\nfrom scipy.integrate import solve_bvp, solve_ivp\n\n\ndef r6(v):\n    if isinstance(v, (list, tuple, np.ndarray)):\n        return [r6(u) for u in v]\n    v = round(float(v), 6)\n    return 0.0 if v == 0 else v\n\n\ndef sig(v, n=4):\n    return f\"{float(v):.{n}g}\"\n\n\n# ---------------------------------------------------------------------------\n# Part 1. Regular perturbation: algebra, then a weakly nonlinear decay\n# ---------------------------------------------------------------------------\ndef regular_roots(eps_list=(0.3, 0.1, 0.03, 0.01)):\n    \"\"\"x^2 + eps x - 1 = 0: positive root ~ 1 - eps/2 + eps^2/8.\"\"\"\n    out = []\n    for e in eps_list:\n        exact = (-e + np.sqrt(e * e + 4)) / 2\n        a1, a2 = 1 - e / 2, 1 - e / 2 + e * e / 8\n        out.append({\"eps\": e, \"exact\": float(exact), \"err1\": float(abs(exact - a1)), \"err2\": float(abs(exact - a2))})\n    return out\n\n\ndef singular_roots(eps_list=(0.3, 0.1, 0.03, 0.01)):\n    \"\"\"eps x^2 + x - 1 = 0: regular root ~ 1 - eps; singular root ~ -1/eps - 1 + eps.\"\"\"\n    out = []\n    for e in eps_list:\n        r = np.sort(np.roots([e, 1, -1]).real)\n        out.append({\"eps\": e, \"big\": float(r[0]), \"big_approx\": float(-1 / e - 1 + e), \"small\": float(r[1]), \"small_approx\": float(1 - e)})\n    return out\n\n\ndef weak_nonlinear(eps=0.2):\n    \"\"\"dc/dt = -c - eps c^2, c(0) = 1: exact c = e^-t / (1 + eps (1 - e^-t)); two-term c0 + eps c1.\"\"\"\n    t = np.linspace(0, 5, 101)\n    exact = np.exp(-t) / (1 + eps * (1 - np.exp(-t)))\n    c0 = np.exp(-t); c1 = -(np.exp(-t) - np.exp(-2 * t))\n    return {\"eps\": eps, \"t\": t.tolist(), \"exact\": exact.tolist(), \"one\": c0.tolist(), \"two\": (c0 + eps * c1).tolist(),\n            \"err1\": float(np.abs(exact - c0).max()), \"err2\": float(np.abs(exact - c0 - eps * c1).max())}\n\n\n# ---------------------------------------------------------------------------\n# Part 2. Singular perturbation: a boundary layer\n# ---------------------------------------------------------------------------\ndef layer(eps, n=401):\n    \"\"\"eps y'' + y' + y = 0, y(0) = 0, y(1) = 1. Outer e^(1-x); inner e(1 - e^(-x/eps)); composite e^(1-x) - e^(1-x/eps).\"\"\"\n    x = np.linspace(0, 1, n)\n    d = np.sqrt(1 - 4 * eps)\n    r1, r2 = (-1 + d) / (2 * eps), (-1 - d) / (2 * eps)\n    # y = A(e^{r1 x} - e^{r2 x}) with y(1) = 1; written to avoid overflow\n    y = (np.exp(r1 * (x - 1)) - np.exp(r2 * x - r1)) / (1 - np.exp(r2 - r1))\n    comp = np.exp(1 - x) - np.exp(1 - x / eps)\n    return {\"eps\": eps, \"x\": x.tolist(), \"exact\": y.tolist(), \"outer\": np.exp(1 - x).tolist(), \"comp\": comp.tolist(),\n            \"err\": float(np.abs(y - comp).max())}\n\n\ndef layer_errors():\n    return [{\"eps\": float(e), \"err\": layer(float(e))[\"err\"]} for e in (0.2, 0.1, 0.05, 0.02, 0.01, 0.005)]\n\n\n# ---------------------------------------------------------------------------\n# Part 3. Michaelis-Menten kinetics and the quasi-steady-state approximation\n# ---------------------------------------------------------------------------\nMM = {\"k1\": 1.0e6, \"km1\": 1.0, \"k2\": 1.0, \"S0\": 1.0e-5}     # 1/(M s), 1/s, 1/s, M  (SYNTHETIC values)\n\n\ndef michaelis(E0):\n    k1, km1, k2, S0 = MM[\"k1\"], MM[\"km1\"], MM[\"k2\"], MM[\"S0\"]\n    Km = (km1 + k2) / k1\n    eps = E0 / (S0 + Km)                                   # Segel and Slemrod (1989)\n    tc = 1 / (k1 * (S0 + Km))                               # time to reach quasi-steady state\n    ts = (S0 + Km) / (k2 * E0)                              # substrate depletion time\n    def full(t, y):\n        s, c = y\n        return [-k1 * (E0 - c) * s + km1 * c, k1 * (E0 - c) * s - (km1 + k2) * c]\n    t = np.linspace(0, 4 * ts, 201)\n    sol = solve_ivp(full, (0, t[-1]), [S0, 0.0], t_eval=t, method=\"Radau\", rtol=1e-10, atol=1e-16)\n    q = solve_ivp(lambda tt, s: [-k2 * E0 * s[0] / (Km + s[0])], (0, t[-1]), [S0], t_eval=t, method=\"Radau\", rtol=1e-10, atol=1e-16)\n    return {\"E0\": E0, \"eps\": float(eps), \"Km\": float(Km), \"tc\": float(tc), \"ts\": float(ts), \"t\": (t / ts).tolist(),\n            \"s_full\": (sol.y[0] / S0).tolist(), \"s_qssa\": (q.y[0] / S0).tolist(), \"c_full\": (sol.y[1] / E0).tolist(),\n            \"err\": float(np.abs(sol.y[0] - q.y[0]).max() / S0)}\n\n\n# ---------------------------------------------------------------------------\n# Part 4. Lab: catalyst slab, first and second order, small and large Thiele modulus\n# ---------------------------------------------------------------------------\ndef slab_numeric(phi, order=1):\n    \"\"\"d2c/dz2 = phi^2 c^n on (0, 1), c'(0) = 0, c(1) = 1; eta = c'(1)/phi^2 (solve_bvp, continuation in phi).\"\"\"\n    z = np.linspace(0, 1, 401)\n    y0 = np.vstack([np.cosh(phi * z) / np.cosh(phi), phi * np.sinh(phi * z) / np.cosh(phi)])\n    fun = lambda z, y: np.vstack([y[1], phi ** 2 * np.maximum(y[0], 0) ** order])\n    bc = lambda ya, yb: np.array([ya[1], yb[0] - 1])\n    sol = solve_bvp(fun, bc, z, y0, tol=1e-8, max_nodes=200000)\n    return {\"phi\": phi, \"order\": order, \"eta\": float(sol.sol(1.0)[1] / phi ** 2), \"z\": z.tolist(), \"c\": sol.sol(z)[0].tolist(), \"ok\": bool(sol.success)}\n\n\ndef slab_first(phi):\n    return {\"phi\": float(phi), \"exact\": float(np.tanh(phi) / phi), \"small\": float(1 - phi ** 2 / 3), \"large\": float(1 / phi)}\n\n\ndef slab_sweep():\n    out = []\n    for phi in np.round(np.concatenate([np.arange(0.2, 2.0, 0.2), np.arange(2.0, 20.01, 1.0)]), 2):\n        q = slab_first(float(phi))\n        q[\"eta2_num\"] = slab_numeric(float(phi), 2)[\"eta\"]\n        q[\"eta2_asym\"] = float(np.sqrt(2 / 3) / phi)\n        out.append(q)\n    return out\n\n\ndef clean(o):\n    if isinstance(o, dict):\n        return {k: clean(v) for k, v in o.items()}\n    if isinstance(o, (list, tuple)):\n        return [clean(v) for v in o]\n    if isinstance(o, (np.floating, float)):\n        v = float(o)\n        return 0.0 if abs(v) < 1e-300 else v\n    if isinstance(o, np.integer):\n        return int(o)\n    return o\n\n\ndef classroom_results():\n    R = {\"lecture\": {\"reg\": regular_roots(), \"sing\": singular_roots(), \"weak\": weak_nonlinear(), \"layer\": layer(0.05),\n                     \"layer_err\": layer_errors(), \"mm\": [michaelis(E) for E in (1e-8, 1e-7, 1e-6, 1e-5)]},\n         \"lab\": {\"phi5\": slab_first(5.0), \"prof1\": slab_numeric(5.0, 1), \"prof2\": slab_numeric(5.0, 2), \"sweep\": slab_sweep()},\n         \"versions\": {\"numpy\": np.__version__, \"scipy\": __import__(\"scipy\").__version__}}\n    return clean(R)\n\n\nif __name__ == \"__main__\":\n    R = classroom_results()\n    if \"--json\" in sys.argv:\n        with open(\"perturb-results.json\", \"w\") as fh:\n            json.dump(R, fh, indent=1)\n        print(\"wrote perturb-results.json\"); sys.exit()\n    L = R[\"lecture\"]\n    print(\"reg\", [(q[\"eps\"], sig(q[\"err1\"]), sig(q[\"err2\"])) for q in L[\"reg\"]])\n    print(\"sing\", [(q[\"eps\"], r6(q[\"big\"]), r6(q[\"big_approx\"])) for q in L[\"sing\"]])\n    print(\"weak err\", sig(L[\"weak\"][\"err1\"]), sig(L[\"weak\"][\"err2\"]))\n    print(\"layer err\", [(q[\"eps\"], sig(q[\"err\"])) for q in L[\"layer_err\"]])\n    print(\"mm\", [(q[\"E0\"], sig(q[\"eps\"]), sig(q[\"err\"]), sig(q[\"tc\"]), sig(q[\"ts\"])) for q in L[\"mm\"]])\n    B = R[\"lab\"]; print(\"phi5\", B[\"phi5\"], \"num1\", r6(B[\"prof1\"][\"eta\"]), \"num2\", r6(B[\"prof2\"][\"eta\"]), B[\"prof2\"][\"ok\"])\n    print(\"sweep\", [(q[\"phi\"], r6(q[\"exact\"]), r6(q[\"eta2_num\"]), r6(q[\"eta2_asym\"])) for q in B[\"sweep\"]][::4])\n";   // embedded copy, so live Python also works when the file is opened locally

/* ---------- tiny SVG chart helpers ---------- */
function svgEl(w,h){return `<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" font-family="Helvetica Neue,Arial,sans-serif">`}
function niceStep(r,n=5){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw||1)));for(const m of [1,2,2.5,5,10]){if(m*p>=raw-1e-12)return m*p}return 10*p}
function scale(o,lo,hi){const st=niceStep(hi-lo);o.step=st;o.ymin=Math.floor(lo/st+1e-9)*st;o.ymax=Math.ceil(hi/st-1e-9)*st;o.ticks=Math.round((o.ymax-o.ymin)/st);return o}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function axes(o){ // o: w,h,l,r,t,b,ymin,ymax,xlabels,ylab,ticks
  const {w,h,l,r,t,b,ymin,ymax}=o, X=w-l-r, Y=h-t-b, n=o.ticks||5; let s="";
  for(let k=0;k<=n;k++){const v=ymin+(ymax-ymin)*k/n, y=t+Y-(v-ymin)/(ymax-ymin)*Y;
    s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="${C.mist}" stroke-width="0.8" opacity=".7"/><text x="${l-8}" y="${y+5}" font-size="16" text-anchor="end" fill="${C.ink}">${fmt(v, (o.step||1)<1?1:0)}</text>`}
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${t+Y}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  const z=t+Y-(0-ymin)/(ymax-ymin)*Y; s+=`<line x1="${l}" x2="${w-r}" y1="${Math.min(t+Y,Math.max(t,z))}" y2="${Math.min(t+Y,Math.max(t,z))}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  if(o.ylab)s+=`<text transform="translate(${16},${t+Y/2}) rotate(-90)" font-size="17" text-anchor="middle" fill="${C.ink}">${o.ylab}</text>`;
  return s}
function ymap(o,v){const Y=o.h-o.t-o.b;return o.t+Y-(v-o.ymin)/(o.ymax-o.ymin)*Y}
function legend(items,x,y){let s="";items.forEach((it,i)=>{const yy=y+i*22;s+=it.line?`<line x1="${x}" x2="${x+22}" y1="${yy}" y2="${yy}" stroke="${it.c}" stroke-width="3" ${it.dash?'stroke-dasharray="6 4"':''}/>`:`<rect x="${x}" y="${yy-8}" width="16" height="16" fill="${it.c}" ${it.op?`opacity="${it.op}"`:''}/>`;s+=`<text x="${x+28}" y="${yy+5}" font-size="16" fill="${C.ink}">${it.t}</text>`});return s}

/* Food Manufacture: stacked bars of a [month][oil] matrix, optional line */
function hbar(items,opt={}){ // items: {t,v,c}
  const w=opt.w||640,h=opt.h||330,l=opt.l||250,r=90,t=16,rowh=(h-t-20)/items.length;
  const mx=opt.max||niceMax(Math.max(...items.map(i=>i.v)));let s=svgEl(w,h);
  items.forEach((it,i)=>{const y=t+i*rowh,bw=(w-l-r)*it.v/mx;
    s+=`<text x="${l-12}" y="${y+rowh/2+5}" font-size="16" text-anchor="end" fill="${C.ink}">${it.t}</text><rect x="${l}" y="${y+rowh*0.18}" width="${Math.max(bw,1)}" height="${rowh*0.64}" fill="${it.c}" rx="3"/><text x="${l+bw+8}" y="${y+rowh/2+6}" font-size="17" font-weight="700" fill="${C.ink}">${opt.fmt?opt.fmt(it.v):fmt(it.v)}</text>`});
  s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-20}" stroke="${C.graphite}" stroke-width="1.5"/>`;
  return s+"</svg>"}

function contours(f,xr,yr,nx,ny,levels,px,py,stroke,sw,op){let s="";const xs=[],ys=[];
 for(let i=0;i<=nx;i++)xs.push(xr[0]+(xr[1]-xr[0])*i/nx);for(let j=0;j<=ny;j++)ys.push(yr[0]+(yr[1]-yr[0])*j/ny);
 const F=ys.map(y=>xs.map(x=>f(x,y)));
 levels.forEach(c=>{let d="";for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const v=[F[j][i],F[j][i+1],F[j+1][i+1],F[j+1][i]],
   P=[[xs[i],ys[j]],[xs[i+1],ys[j]],[xs[i+1],ys[j+1]],[xs[i],ys[j+1]]],pts=[];
  for(let k=0;k<4;k++){const a=v[k],b=v[(k+1)%4];if((a<c)!==(b<c)){const q=(c-a)/(b-a),A=P[k],B=P[(k+1)%4];pts.push([A[0]+q*(B[0]-A[0]),A[1]+q*(B[1]-A[1])])}}

/* rank of a small matrix by elimination with a tolerance (for the reaction-set demo) */
function rankOf(M){if(!M.length)return 0;const A=M.map(r=>r.slice());const m=A.length,n=A[0].length;let r=0;
 for(let c=0;c<n&&r<m;c++){let p=r;for(let i=r+1;i<m;i++)if(Math.abs(A[i][c])>Math.abs(A[p][c]))p=i;if(Math.abs(A[p][c])<1e-9)continue;
  [A[r],A[p]]=[A[p],A[r]];for(let i=0;i<m;i++)if(i!==r){const f=A[i][c]/A[r][c];for(let j=c;j<n;j++)A[i][j]-=f*A[r][j]}r++}return r}

 let s=v.toFixed(Math.max(0,n-1-e));if(s.includes("."))s=s.replace(/\.?0+$/,"");return s};

S.push({kicker:"Part 2 · Boundary layers", title:"Outer solution, inner solution, matching, composite", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.7">
εy″ + y′ + y = 0, &nbsp;y(0) = 0, y(1) = 1<br>

Inner, X = x/ε: Y″ + Y′ = O(ε) ⇒ Y = A(1 − e<sup>−X</sup>) (meets y(0) = 0)<br>
Matching: Y(X → ∞) = y<sub>o</sub>(x → 0) ⇒ A = e<br>
Composite: y<sub>c</sub> = y<sub>o</sub> + y<sub>i</sub> − e = e<sup>1−x</sup> − e<sup>1−x/ε</sup></div></div>
<p class="note">Where is the layer? At the end where the outer solution fails; its thickness is set by the balance of εy″ with y′, so δ = ε. A layer at the other end would grow, not decay, and cannot match.</p></div>
<div class="col"><ul class="b xs"><li>The outer solution is valid away from x = 0; the inner one is valid in a region of width O(ε) near x = 0</li>
<li>Matching (Van Dyke’s rule in its simplest form): the inner solution far out equals the outer solution close in</li>
<li>The composite adds both and subtracts the common part, so it is uniformly valid with error O(ε)</li>

S.push({kicker:"Part 2 · The quasi-steady-state approximation", title:"The QSSA is the outer solution of a singular perturbation", html:()=>`<div class="body"><div class="col w55"><div class="panel grow"><div class="chart" id="ch-mm"></div></div></div>

S.push({kicker:"Part 2 · Derivation", title:"Derive the scaled Michaelis–Menten model and its small parameter", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:18px"><tr><th class="n">#</th><th>Step</th><th>Why</th></tr><tr><td class="n">1</td><td class="math" style="font-size:19px">dS/dt = −k<sub>1</sub>(E<sub>0</sub> − C)S + k<sub>−1</sub>C, &nbsp;dC/dt = k<sub>1</sub>(E<sub>0</sub> − C)S − (k<sub>−1</sub> + k<sub>2</sub>)C</td><td>Mass action, with the enzyme balance E = E<sub>0</sub> − C</td></tr><tr><td class="n">2</td><td class="math" style="font-size:19px">s = S/S<sub>0</sub>, &nbsp;c = C/C̄, &nbsp;C̄ = E<sub>0</sub>S<sub>0</sub>/(S<sub>0</sub> + K<sub>M</sub>)</td><td>Scale C by the largest value it can reach (the QSSA value at S = S<sub>0</sub>)</td></tr><tr><td class="n">3</td><td class="math" style="font-size:19px">τ = t/t<sub>s</sub>, &nbsp;t<sub>s</sub> = (S<sub>0</sub> + K<sub>M</sub>)/(k<sub>2</sub>E<sub>0</sub>)</td><td>Slow time: S<sub>0</sub> divided by the largest rate k<sub>2</sub>C̄</td></tr><tr><td class="n">4</td><td class="math" style="font-size:19px">ε dc/dτ = s − (s + κ)c/(1 + κ), &nbsp;ε = t<sub>c</sub>/t<sub>s</sub> = k<sub>2</sub>E<sub>0</sub>/(k<sub>1</sub>(S<sub>0</sub> + K<sub>M</sub>)²)</td><td>Divide the C balance by its fast rate k<sub>1</sub>(S<sub>0</sub> + K<sub>M</sub>); κ = K<sub>M</sub>/S<sub>0</sub></td></tr><tr><td class="n">5</td><td class="math" style="font-size:19px">ε ≤ E<sub>0</sub>/(S<sub>0</sub> + K<sub>M</sub>) since k<sub>2</sub> ≤ k<sub>1</sub>K<sub>M</sub></td><td>K<sub>M</sub> = (k<sub>−1</sub> + k<sub>2</sub>)/k<sub>1</sub>, so the Segel–Slemrod ratio bounds ε</td></tr><tr><td class="n">6</td><td class="math" style="font-size:19px">ε → 0: c = s(1 + κ)/(s + κ) ⇒ dS/dt = −k<sub>2</sub>E<sub>0</sub>S/(K<sub>M</sub> + S)</td><td>Outer solution: the Michaelis–Menten rate law</td></tr></table><p class="note">Choosing C̄ is the key step: scaling C by E<sub>0</sub> instead hides the correct small parameter when S<sub>0</sub> ≪ K<sub>M</sub>.</p></div></div>`});
S.push({kicker:"Check 2 · 5 minutes", title:"Check 2: singular perturbation", html:()=>CHECK(2,`${OL}
<li>Why does setting ε = 0 in εy″ + y′ + y = 0 lose a boundary condition?</li>
<li>For εy″ − y′ + y = 0 with y(0) = 0, y(1) = 1, at which end is the layer?</li>
<li>Write the composite solution from an outer y<sub>o</sub> and an inner y<sub>i</sub> whose common limit is y<sub>m</sub>.</li>
<li>In the QSSA, what happens during the first t<sub>c</sub>, and why is that the inner solution?</li></ol>`,
`<li>1. The equation drops from second to first order, and a first-order equation can satisfy only one of the two conditions</li>
<li>2. At x = 1: inner solutions there behave like e<sup>(x−1)/ε</sup>, which decays into the domain; at x = 0 they would grow</li>
<li>3. y<sub>c</sub> = y<sub>o</sub> + y<sub>i</sub> − y<sub>m</sub></li>
<li>4. The enzyme–substrate complex builds up from zero on the fast scale t<sub>c</sub>, while S hardly changes; the QSSA (outer) cannot meet c(0) = 0</li>`),
draw:()=>reveal("k2btn","k2ans")});

S.push({kicker:"Part 3 · When expansions break", title:"Secular terms, and the method of multiple scales", html:()=>`<div class="body"><div class="col w55"><div class="panel"><div class="math" style="font-size:18px;line-height:1.75">
y″ + y + εy³ = 0 (a weakly nonlinear oscillator)<br>
Naive expansion: y<sub>1</sub> contains t sin t: grows without bound<br>
Valid only while εt ≪ 1<br>
Multiple scales: y(t, T) with T = εt; remove the secular term by letting the amplitude and phase depend on T<br>
Result: frequency ω ≈ 1 + 3εa²/8</div></div>
<p class="note">Secular term: a term that grows in time, making a “small” correction eventually larger than the leading term. It signals that a slow time scale was missed.</p></div>
<div class="col"><ul class="b xs"><li>The weak decay of Part 1 had no secular term because each order decayed. Oscillations and slow drifts produce them</li>
<li>The fix introduces a second, slow time and demands that the expansion stay bounded; that condition gives the slow evolution of the amplitude</li>
<li>The same idea gives the amplitude equation dr/dt = μr − ar³ near a Hopf point (Session 5), and averaging methods for periodically operated reactors</li>
<li>In this course you need to recognize the symptom; the full method is in Bender and Orszag, Chapter 11</li></ul></div></div>`});

S.push({kicker:"Part 3 · The Thiele modulus limits", title:"The effectiveness factor at small and large φ", html:()=>`<div class="body"><div class="col w55"><div class="panel grow"><div class="chart" id="ch-th"></div></div></div>
<div class="col"><div class="panel" style="padding:12px 14px"><div class="math" style="font-size:17px;line-height:1.6">First order, slab: η = tanh φ/φ<br>Small φ (regular): η ≈ 1 − φ²/3<br>Large φ (layer of width 1/φ): η ≈ 1/φ<br>Order n, large φ: η ≈ (1/φ)√(2/(n + 1))</div></div>
<ul class="b xs" style="margin-top:10px"><li>At large φ the reactant penetrates a layer of thickness L/φ; the rate is the surface rate times that thickness. That is the boundary-layer argument in one line</li>
<li>The n-th order result comes from integrating the layer equation once: it needs no full solution (Aris; Bischoff, 1965)</li>
<li>Lab 6 tests both limits against numerical solutions</li></ul></div></div>`,
draw:()=>{const Sw=LB().sweep;document.getElementById("ch-th").innerHTML=xyChart({w:560,h:420,xmin:0,xmax:10,xstep:2,ymin:0,ymax:1.1,ystep:0.2,yfmt:v=>fmt(v,1),xlab:"Thiele modulus φ",ylab:"effectiveness factor η (first order)",
 series:[{pts:Sw.filter(q=>q.phi<=10).map(q=>[q.phi,q.exact]),c:C.ink,w:4},{pts:Sw.filter(q=>q.phi<=1.6).map(q=>[q.phi,q.small]),c:C.teal,w:2.6,dash:true},{pts:Sw.filter(q=>q.phi>=1&&q.phi<=10).map(q=>[q.phi,q.large]),c:C.amber,w:2.6,dash:true}],
 legend:[{c:C.ink,line:true,t:"exact tanh φ/φ"},{c:C.teal,line:true,dash:true,t:"1 − φ²/3"},{c:C.amber,line:true,dash:true,t:"1/φ"}],lx:330,ly:40})}});

S.push({kicker:"Part 3 · Derivation", title:"Derive η at large φ for any order, without solving the full problem", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:18px"><tr><th class="n">#</th><th>Step</th><th>Why</th></tr><tr><td class="n">1</td><td class="math" style="font-size:19px">u″ = φ²u<sup>n</sup>, u′(0) = 0, u(1) = 1; &nbsp;η = u′(1)/φ²</td><td>Slab, reaction of order n; η from the flux at the surface</td></tr><tr><td class="n">2</td><td class="math" style="font-size:19px">Inner variable ξ = φ(1 − z): u<sub>ξξ</sub> = u<sup>n</sup></td><td>Large φ: all the change happens within 1/φ of the surface</td></tr><tr><td class="n">3</td><td class="math" style="font-size:19px">Multiply by u<sub>ξ</sub> and integrate: ½u<sub>ξ</sub>² = u<sup>n+1</sup>/(n + 1) + const</td><td>First integral: no need to solve for u(ξ)</td></tr><tr><td class="n">4</td><td class="math" style="font-size:19px">Deep inside (ξ → ∞): u → 0, u<sub>ξ</sub> → 0 ⇒ const = 0</td><td>Matching to the outer solution u = 0</td></tr><tr><td class="n">5</td><td class="math" style="font-size:19px">At the surface u = 1: |u<sub>ξ</sub>| = √(2/(n + 1)), &nbsp;u′(1) = φ√(2/(n + 1))</td><td>dz = −dξ/φ</td></tr><tr><td class="n">6</td><td class="math" style="font-size:19px"><b>η ≈ (1/φ)√(2/(n + 1))</b>; n = 1 gives 1/φ, n = 2 gives 0.816/φ</td><td>Valid when φ is large; Lab 6 measures how large</td></tr></table><p class="note">For 0 ≤ n &lt; 1 the reactant is used up at a finite depth (a dead zone), and the same first integral gives that depth.</p></div></div>`});
S.push({kicker:"Part 3 · Reporting", title:"How to report an asymptotic result", html:()=>`<div class="body"><div class="col"><table class="t" style="font-size:18px">
<tr><th>Report</th><th>Why</th></tr>
<tr><td>The scales used and the resulting dimensionless groups, with their values for your system</td><td>The reader can check which terms you neglected and by how much</td></tr>
<tr><td>The small parameter, and whether the limit is regular or singular</td><td>It tells the reader what kind of approximation to expect</td></tr>
<tr><td>The order of the approximation, O(ε) or O(ε²)</td><td>Gives the size of the error before any computation</td></tr>
<tr><td>A comparison with the numerical or exact solution at your parameter values</td><td>The order says how the error scales, not how large it is at your ε</td></tr>
<tr><td>The range of validity, with the evidence</td><td>For a second-order rate the large-φ asymptote is 25% high at φ = 1, 5% at φ = 2 and 0.2% at φ = 5 (Lab 6)</td></tr></table>
<p class="note">An asymptotic formula is a model of a model. It is worth reporting because it shows which group controls the result, which a table of numerical solutions does not.</p></div></div>`});

S.push({kicker:"Check 3 · 5 minutes", title:"Check 3: limits and breakdowns", html:()=>CHECK(3,`${OL}
<li>A pellet has φ = 20 for a first-order reaction. Estimate η, and the fraction of the pellet that is active.</li>
<li>Why is the small-φ limit regular and the large-φ limit singular?</li>
<li>A perturbation solution contains a term εt cos t. For how long can you trust it?</li>
<li>Give the large-φ effectiveness factor for a second-order reaction.</li></ol>`,
`<li>1. η ≈ 1/φ = 0.05; reaction occurs in a layer of about 1/φ = 5% of the half thickness</li>
<li>2. Small φ: φ² multiplies the lower-order term, and φ = 0 leaves a solvable problem (u = 1). Large φ: 1/φ² multiplies the highest derivative, so the reduced problem u = 0 cannot meet the surface condition</li>
<li>3. While εt ≪ 1, that is t ≪ 1/ε; afterwards the correction is not small (a secular term)</li>
<li>4. η ≈ (1/φ)√(2/3) ≈ 0.816/φ</li>`),
draw:()=>reveal("k3btn","k3ans")});

S.push({kicker:"Check 4 · 5 minutes", title:"Check 4: building an expansion", html:()=>CHECK(4,`${OL}
<li>For εy″ + y′ = 1, y(0) = y(1) = 0, find the outer solution that meets y(1) = 0.</li>
<li>Find the inner solution near x = 0 that meets y(0) = 0.</li>
<li>Match them and write the composite.</li>
<li>How would you check your composite numerically?</li></ol>`,
`<li>1. y′ = 1 ⇒ y<sub>o</sub> = x − 1</li>
<li>2. X = x/ε: Y″ + Y′ = 0 at leading order ⇒ Y = A(1 − e<sup>−X</sup>)</li>
<li>3. Y(∞) = A must equal y<sub>o</sub>(0) = −1, so A = −1; y<sub>c</sub> = x − 1 + e<sup>−x/ε</sup></li>
<li>4. Solve the BVP with solve_bvp at several ε and confirm that the largest error falls in proportion to ε</li>`),

<div class="col"><ul class="b xs"><li>Scale every variable by the size it reaches; the groups left over carry the physics, and one may be small</li>

<li>Singular: ε multiplies the highest term; a root or a boundary condition is lost and recovered on a short scale</li>
<li>Outer + inner − common = composite, uniformly valid</li>
